<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算法可视化</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --text: #1f1d1a; --faint: #7a766f; --border: #e0ddd6;
  --accent: hsl(160, 60%, 40%); --warn: #d97706; --ok: #16a34a; --bad: #dc2626; --info: #2563eb;
}
:root[data-theme="dark"] {
  --bg: #191816; --surface: #23211e; --text: #ece9e3; --faint: #9a958c; --border: #37342f;
  --accent: hsl(160, 55%, 55%); --warn: #f59e0b; --ok: #4ade80; --bad: #f87171; --info: #60a5fa;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; }
.chip { font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
#stage { min-height: 220px; overflow: auto; }
#note { min-height: 24px; font-weight: 600; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--faint); font-size: 12px; margin-top: 8px; }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 12px; min-height: 32px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=range] { accent-color: var(--accent); }
#progress { flex: 1 1 200px; min-width: 120px; }
textarea { width: 100%; min-height: 60px; font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }
#error { color: var(--bad); min-height: 20px; font-size: 13px; }
footer { color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="chip" id="complexity"></span>
  <span class="chip" id="stepInfo">0 / 0</span>
</header>

<div class="card">
  <div id="note" aria-live="polite"></div>
  <div id="stage"></div>
  <div id="legend"></div>
</div>

<div class="card controls" role="group" aria-label="播放控制">
  <button id="btnReset" title="重置 (Home)">重置</button>
  <button id="btnPrev" title="上一步 (←)">上一步</button>
  <button id="btnPlay" class="primary" title="播放 / 暂停 (空格)">播放</button>
  <button id="btnNext" title="下一步 (→)">下一步</button>
  <input id="progress" type="range" min="0" max="0" value="0" aria-label="进度">
  <label>速度 <input id="speed" type="range" min="1" max="10" value="5" aria-label="速度"></label>
</div>

<div class="card">
  <label for="input"><b>输入数据</b></label>
  <textarea id="input" spellcheck="false"></textarea>
  <div class="controls" style="margin-top:8px">
    <button id="btnApply">应用输入</button>
    <button id="btnRandom">随机生成</button>
    <span id="hint" class="chip"></span>
  </div>
  <div id="error" role="alert"></div>
</div>

<footer>教学演示，以模板代码为准。快捷键：空格 播放/暂停，← → 单步，Home 重置。</footer>

<script>
/* === ALGO START：只允许修改这一段（示例：二分查找） === */
const META = {
  title: '二分查找',
  complexity: '时间 O(log n)　空间 O(1)',
  inputHint: '第一行：升序数组；第二行：目标值',
  legend: [
    { color: 'var(--info)', text: '[l, r] 搜索区间' },
    { color: 'var(--warn)', text: 'mid' },
    { color: 'var(--ok)', text: '命中' },
    { color: 'var(--border)', text: '已排除' },
  ],
};
const MAX_N = 24;
const DEFAULT_INPUT = '1 3 5 7 9 11 13 15\n11';

function parseInput(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('需要两行：数组 和 目标值');
  const arr = lines[0].trim().split(/\s+/).map(Number);
  const target = Number(lines[1].trim());
  if (arr.length === 0 || arr.length > MAX_N) throw new Error('数组长度需在 1 到 ' + MAX_N + ' 之间');
  if (arr.some(Number.isNaN) || Number.isNaN(target)) throw new Error('只能输入数字');
  for (let i = 1; i < arr.length; i++) if (arr[i] < arr[i - 1]) throw new Error('数组必须升序');
  return { arr, target };
}

function randomInput() {
  const n = 6 + Math.floor(Math.random() * 8);
  const set = new Set();
  while (set.size < n) set.add(1 + Math.floor(Math.random() * 60));
  const arr = [...set].sort((a, b) => a - b);
  const target = Math.random() < 0.7 ? arr[Math.floor(Math.random() * n)] : 61;
  return arr.join(' ') + '\n' + target;
}

/* 每一帧必须是自包含的状态快照（不依赖前一帧），note 为这一步的中文说明 */
function buildFrames({ arr, target }) {
  const frames = [];
  let l = 0, r = arr.length - 1;
  frames.push({ note: '目标值 ' + target + '，初始区间 [0, ' + r + ']', l, r, mid: -1, found: -1 });
  while (l <= r) {
    const mid = (l + r) >> 1;
    frames.push({ note: 'mid = ' + mid + '，a[mid] = ' + arr[mid], l, r, mid, found: -1 });
    if (arr[mid] === target) {
      frames.push({ note: '命中：下标 ' + mid, l, r, mid, found: mid });
      return frames;
    }
    if (arr[mid] < target) {
      l = mid + 1;
      frames.push({ note: 'a[mid] < 目标，l = mid + 1 = ' + l, l, r, mid: -1, found: -1 });
    } else {
      r = mid - 1;
      frames.push({ note: 'a[mid] > 目标，r = mid - 1 = ' + r, l, r, mid: -1, found: -1 });
    }
  }
  frames.push({ note: '区间为空，未找到', l, r, mid: -1, found: -1 });
  return frames;
}

/* 只根据 frame 与 data 绘制，不得修改它们；颜色一律使用 CSS 变量 */
function render(frame, stage, data) {
  const { arr } = data;
  stage.innerHTML = '';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end';
  arr.forEach((v, i) => {
    const cell = document.createElement('div');
    const inRange = i >= frame.l && i <= frame.r;
    let bg = inRange ? 'var(--surface)' : 'var(--border)';
    let bd = inRange ? 'var(--info)' : 'var(--border)';
    if (i === frame.mid) bd = 'var(--warn)';
    if (i === frame.found) { bg = 'var(--ok)'; bd = 'var(--ok)'; }
    cell.style.cssText = 'width:44px;text-align:center;border:2px solid ' + bd + ';background:' + bg +
      ';color:' + (i === frame.found ? '#fff' : 'var(--text)') + ';border-radius:8px;padding:6px 0';
    cell.innerHTML = '<div style="font-weight:700">' + v + '</div><div style="font-size:11px;opacity:.7">' + i + '</div>';
    row.appendChild(cell);
  });
  stage.appendChild(row);
}
/* === ALGO END === */

/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
</body>
</html>
