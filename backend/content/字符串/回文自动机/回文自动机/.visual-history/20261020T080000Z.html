<script type="text/plain" id="code-src">
int sz, last; //sz 是最后建出的节点编号（0、1 是根），last 是当前前缀的最长回文后缀
int len[maxn], fail[maxn], nxt[maxn][26], cnt[maxn]; //cnt 建完后 = 该回文串的出现次数
string s;

void pam_init()
{
	sz = 1;
	len[0] = 0; fail[0] = 1; //0 号偶根：长度 0，fail 指向奇根
	len[1] = -1; fail[1] = 1; //1 号奇根：长度 -1，让单字符也能套同一个扩展公式
	memset(nxt[0], 0, sizeof(nxt[0]));
	memset(nxt[1], 0, sizeof(nxt[1]));
	last = 0;
}

// 从 u 沿 fail 往上找，返回第一个能在两边接上 s[pos] 的回文后缀
// 奇根 len = -1，条件 pos - len[u] - 1 >= 0 恒成立，所以循环一定停得下来
int getfail(int u, int pos)
{
	while(pos - len[u] - 1 < 0 || s[pos - len[u] - 1] != s[pos]) u = fail[u];
	return u;
}

void add(int pos)
{
	int c = s[pos] - 'a';
	int cur = getfail(last, pos);
	if(!nxt[cur][c]) //这种回文串第一次出现才建新点
	{
		int now = ++ sz;
		len[now] = len[cur] + 2;
		memset(nxt[now], 0, sizeof(nxt[now]));
		if(len[now] == 1) fail[now] = 0; //单字符的最长真回文后缀是空串，即偶根
		else fail[now] = nxt[getfail(fail[cur], pos)][c]; //接在 cur 的最长真回文后缀上
		nxt[cur][c] = now;
	}
	last = nxt[cur][c];
	cnt[last] ++; //这里只给"当前最长回文后缀"计 1，更短的出现在后面靠 fail 树累加
}

// 两种 cnt 语义：建树时的 cnt 是"以该回文串结尾的前缀个数"；沿 fail 树逆序累加后才是出现次数
// 不用建 fail 树：fail 一定指向更早创建的节点，所以编号从大到小就是 fail 树自底向上的顺序
void count_occurrences()
{
	for(int u = sz; u >= 2; u --) cnt[fail[u]] += cnt[u];
}

int main()
{
	ios::sync_with_stdio(false);
	cin.tie(0); cout.tie(0);
	
	cin >> s;
	pam_init();
	for(int i = 0; i < (int)s.size(); i ++) add(i);
	
	int mx = 0; //最长回文子串长度
	for(int i = 2; i <= sz; i ++) mx = max(mx, len[i]);
	count_occurrences();
	ll tot = 0; //回文子串总数（按区间计），全同字符时约 n^2/2 = 5e11，必须 ll
	for(int i = 2; i <= sz; i ++) tot += cnt[i];
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：回文自动机 PAM === */
const META = {
  title: '回文自动机 PAM：本质不同回文串与出现次数',
  complexity: '建机 O(|s|)（fail 跳转均摊）　统计 O(状态数)',
  inputHint: '一行小写字母串（长度 <= 8）',
  file: '回文自动机.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--info)', text: 'nxt 转移边（带字符）' },
    { color: 'var(--accent)', text: '当前 add 的节点 / 正在处理的字符' },
    { color: 'var(--warn)', text: 'getfail 跳转路径与 fail 指针（虚线）' },
    { color: 'var(--ok)', text: '新建节点 / 最终答案' },
    { color: 'var(--border)', text: '两个根与普通状态' },
  ],
};
const MAX_N = 8;
const DEFAULT_INPUT = 'ababa';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入一行小写字母串');
  const s = text.trim();
  if (!/^[a-z]+$/.test(s)) throw new Error('只允许小写字母');
  if (s.length > MAX_N) throw new Error('串长需 <= ' + MAX_N + '（演示规模）');
  return { s };
}

function randomInput() {
  const n = 4 + Math.floor(Math.random() * 5);
  let s = '';
  for (let i = 0; i < n; i++) s += 'abc'[Math.floor(Math.random() * 3)];
  return s;
}

function buildFrames({ s }) {
  const frames = [];
  const maxS = s.length + 5;
  const len = new Array(maxS).fill(0);
  const fail = new Array(maxS).fill(0);
  const cnt = new Array(maxS).fill(0);
  const nxt = Array.from({ length: maxS }, () => ({}));
  let sz = 0, last = 0;
  let mx = 0, tot = 0, pos = -1, cur = -1, now = -1, gu = -1;

  function states() {
    const r = [];
    for (let id = 0; id <= sz; id++) r.push({ id, len: len[id], fail: fail[id], cnt: cnt[id] });
    return r;
  }
  function edges() {
    const r = [];
    for (let id = 0; id <= sz; id++) {
      for (const ch of Object.keys(nxt[id])) r.push({ u: id, v: nxt[id][ch], c: ch });
    }
    return r;
  }
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [5], phase: 'init', s: s.split(''), sz, last, pos, cur, now, gu,
    states: states(), edges: edges(), mx, tot, ans: 0,
  }, f));

  sz = 1;
  len[0] = 0; fail[0] = 1;
  len[1] = -1; fail[1] = 1;
  last = 0;
  snap({ note: 'pam_init：sz = 1，0 号偶根 len = 0，1 号奇根 len = -1，last = 0', lines: [7, 8, 9, 12], phase: 'init', last });

  function getfail(u, p) {
    while (p - len[u] - 1 < 0 || s[p - len[u] - 1] !== s[p]) {
      snap({
        note: 'getfail：u = ' + u + '，pos - len[u] - 1 = ' + (p - len[u] - 1) + '，' +
          (p - len[u] - 1 < 0 ? '越界' : 's[' + (p - len[u] - 1) + '] = ' + s[p - len[u] - 1] + ' != s[' + p + '] = ' + s[p]) +
          ' → u = fail[u] = ' + fail[u],
        lines: [19], phase: 'getfail', u, gu: fail[u], pos: p,
      });
      u = fail[u];
    }
    snap({ note: 'getfail 返回 u = ' + u + (u === 1 ? '（奇根 len = -1，条件恒成立）' : '（两端能接上 ' + s[p] + '）'), lines: [19, 20], phase: 'getfail', u, gu: u, pos: p });
    return u;
  }

  for (let p = 0; p < s.length; p++) {
    pos = p;
    const c = s[p];
    snap({ note: 'add(' + p + ')：字符 ' + c + '，last = ' + last + '，先 cur = getfail(last, pos)', lines: [23, 25, 26], phase: 'add', pos: p, c, cur: -1, now: -1 });
    const cf = getfail(last, p);
    cur = cf;
    snap({ note: 'cur = getfail(last, pos) = ' + cur + '，看 nxt[cur][' + c + '] 是否已存在', lines: [26, 27], phase: 'add', cur, pos: p, c, now: -1 });
    if (!nxt[cur][c]) {
      now = ++sz;
      len[now] = len[cur] + 2;
      snap({ note: 'nxt[' + cur + '][' + c + '] 为空：now = ++sz = ' + now + '，len[now] = len[cur]+2 = ' + len[now], lines: [29, 30], phase: 'new', cur, now, pos: p, c });
      if (len[now] === 1) {
        fail[now] = 0;
        snap({ note: 'len[now] == 1：单字符回文串的最长真回文后缀是空串 → fail[now] = 0', lines: [32], phase: 'new', cur, now, pos: p, c });
      } else {
        snap({ note: 'len[now] != 1：fail[now] = nxt[getfail(fail[cur], pos)][c]，先对 fail[cur] = ' + fail[cur] + ' 求 getfail', lines: [33], phase: 'new', cur, now, pos: p, c });
        const gf = getfail(fail[cur], p);
        fail[now] = nxt[gf][c];
        snap({ note: 'getfail(fail[cur], pos) = ' + gf + '，fail[now] = nxt[' + gf + '][' + c + '] = ' + fail[now], lines: [33], phase: 'new', cur, now, gu: gf, pos: p, c });
      }
      nxt[cur][c] = now;
      snap({ note: 'nxt[' + cur + '][' + c + '] = now = ' + now + '，新回文串首次出现', lines: [34], phase: 'new', cur, now, pos: p, c });
    }
    last = nxt[cur][c];
    cnt[last]++;
    snap({ note: 'last = nxt[cur][c] = ' + last + '，cnt[last]++ → ' + cnt[last] + '（只给当前最长回文后缀计 1）', lines: [36, 37], phase: 'add', cur, now, last, pos: p, c });
  }

  snap({ note: '建机完成：sz = ' + sz + '（含两个根），本质不同回文串 = sz-1 = ' + (sz - 1), lines: [42, 44], phase: 'count' });
  for (let u = sz; u >= 2; u--) {
    cnt[fail[u]] += cnt[u];
    snap({ note: '倒序累加：cnt[fail[' + u + ']=' + fail[u] + '] += cnt[' + u + '] = ' + cnt[u] + ' → ' + cnt[fail[u]], lines: [44], phase: 'count', u });
  }
  snap({ note: 'fail 树累加完成，cnt[i] 就是回文串 i 的出现次数', lines: [44, 45], phase: 'count' });

  for (let u = 2; u <= sz; u++) mx = Math.max(mx, len[u]);
  for (let u = 2; u <= sz; u++) tot += cnt[u];
  snap({ note: '最长回文子串长度 mx = ' + mx + '；回文子串总数 tot = Σcnt = ' + tot, lines: [56, 57, 59, 60], phase: 'done', mx, tot, ans: mx });
  return frames;
}

function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');
  const sub = document.createElement('div');
  sub.className = 'sub-line';
  sub.textContent = '串 s = ' + data.s + '　节点数 sz = ' + frame.sz + '（不含两个根另有 ' + Math.max(0, frame.sz - 1) + ' 个回文串）' +
    (frame.phase === 'done' ? '　mx = ' + frame.mx + '，tot = ' + frame.tot : '');
  box.appendChild(sub);

  const row = document.createElement('div');
  row.className = 'strip';
  for (let i = 0; i < data.s.length; i++) {
    const c = document.createElement('div');
    c.className = 'b' + (frame.pos === i ? ' on' : '');
    c.textContent = data.s[i];
    c.style.maxWidth = '26px';
    row.appendChild(c);
  }
  box.appendChild(row);

  const byLen = {};
  frame.states.forEach((st) => { (byLen[st.len] = byLen[st.len] || []).push(st); });
  const pos = {};
  Object.keys(byLen).forEach((k) => {
    byLen[k].forEach((st, idx) => {
      pos[st.id] = { x: 34 + (Number(k) + 1) * 48, y: 34 + idx * 52 };
    });
  });
  const maxY = Math.max(60, ...Object.keys(pos).map((id) => pos[id].y));
  const W = 460, H = maxY + 44;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:480px" role="img">';
  svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--surface)"/>';
  frame.states.forEach((st) => {
    if (st.id === 0 || st.id === 1) return;
    const A = pos[st.id], B = pos[st.fail];
    if (!A || !B) return;
    svg += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y + '" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.8"/>';
  });
  frame.edges.forEach((e) => {
    const A = pos[e.u], B = pos[e.v];
    if (!A || !B) return;
    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
    const x1 = A.x + dx / d * 15, y1 = A.y + dy / d * 15, x2 = B.x - dx / d * 17, y2 = B.y - dy / d * 17;
    svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--info)" stroke-width="1.4" opacity="0.7"/>';
    svg += '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - dx / d * 7 - dy / d * 4) + ',' + (y2 - dy / d * 7 + dx / d * 4) + ' ' + (x2 - dx / d * 7 + dy / d * 4) + ',' + (y2 - dy / d * 7 - dx / d * 4) + '" fill="var(--info)"/>';
    svg += '<text x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 - 3) + '" font-size="11" text-anchor="middle" fill="var(--text)">' + e.c + '</text>';
  });
  frame.states.forEach((st) => {
    const P = pos[st.id];
    let stroke = 'var(--border)', width = 2, dash = '';
    if (st.id === frame.now) stroke = 'var(--ok)';
    else if (st.id === frame.cur || st.id === frame.u) stroke = 'var(--accent)';
    else if (st.id === frame.gu) stroke = 'var(--warn)';
    if (st.id === 0 || st.id === 1) { stroke = 'var(--faint)'; dash = 'stroke-dasharray="3 2"'; }
    svg += '<circle cx="' + P.x + '" cy="' + P.y + '" r="15" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '" ' + dash + '/>';
    svg += '<text x="' + P.x + '" y="' + (P.y + 4) + '" font-size="11" text-anchor="middle" fill="var(--text)">' + st.id + '</text>';
    svg += '<text x="' + P.x + '" y="' + (P.y + 26) + '" font-size="9" text-anchor="middle" fill="var(--faint)">len' + st.len + ' cnt' + st.cnt + '</text>';
  });
  svg += '</svg>';
  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  box.appendChild(wrap);

  const prow = document.createElement('div');
  prow.className = 'plist';
  frame.states.forEach((st) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (st.id === frame.now ? ' on' : '');
    c.textContent = st.id + ':len' + st.len + ',fail' + st.fail + ',cnt' + st.cnt;
    prow.appendChild(c);
  });
  box.appendChild(prow);

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'done') eq.textContent = '本质不同回文串 ' + (frame.sz - 1) + ' 个，最长 ' + frame.mx + '，按区间计共 ' + frame.tot + ' 个';
  else if (frame.cur >= 0 || frame.now >= 0) eq.textContent = 'cur = ' + frame.cur + '，now = ' + frame.now + '，last = ' + frame.last + '（fail 边用虚线画出）';
  else eq.textContent = '0 号是偶根（len 0），1 号是奇根（len -1）；实线是 nxt 转移，虚线是 fail。';
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
