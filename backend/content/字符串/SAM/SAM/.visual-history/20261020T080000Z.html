<script type="text/plain" id="code-src">
int sz, last;
int len[maxn], lnk[maxn], nxt[maxn][26], cnt[maxn]; //lnk 就是后缀链接 link，nxt 是转移，避开 std::next 和 Linux 的 link()
int buc[maxm], ord[maxn];

void sam_init()
{
	sz = last = 1; //根固定是 1 号；0 号不用，lnk[1] = 0 当"没有后缀链接"
	len[1] = 0; lnk[1] = 0; cnt[1] = 0;
	memset(nxt[1], 0, sizeof(nxt[1]));
}

void extend(int c)
{
	int p = last, u = ++ sz;
	len[u] = len[p] + 1; //新主状态代表的最长串 = 当前前缀
	cnt[u] = 1; //主状态：一个前缀末尾贡献 1 次出现；clone 点必须清 0
	memset(nxt[u], 0, sizeof(nxt[u]));
	for(; p && !nxt[p][c]; p = lnk[p]) nxt[p][c] = u; //沿 lnk 把缺 c 转移的都补上
	if(!p) lnk[u] = 1; //一路补到根：u 的最长真后缀只剩空串
	else
	{
		int q = nxt[p][c];
		if(len[q] == len[p] + 1) lnk[u] = q;
		else //拆点：q 里混了两种 endpos，克隆出长度恰好 len[p]+1 的那一半
		{
			int clone = ++ sz;
			len[clone] = len[p] + 1;
			lnk[clone] = lnk[q];
			memcpy(nxt[clone], nxt[q], sizeof(nxt[q]));
			cnt[clone] = 0; //clone 不是某次插入的末尾，不能计 1
			lnk[u] = lnk[q] = clone;
			for(; p && nxt[p][c] == q; p = lnk[p]) nxt[p][c] = clone;
		}
	}
	last = u;
}

// 求 endpos 大小（= 出现次数）：按 len 计数排序得到"len 升序"的拓扑序，再倒着沿 lnk 累加
// 不能递归 DFS：lnk 树最坏是一条 n 深的链（全 a 的串），1e6 直接爆栈；
// 按 len 基数排序是因为 len[lnk[u]] < len[u]，len 降序天然就是 lnk 树自底向上的顺序
void build()
{
	int total = len[last]; //串长
	memset(buc, 0, sizeof(buc));
	for(int i = 1; i <= sz; i ++) buc[len[i]] ++;
	for(int i = 1; i <= total; i ++) buc[i] += buc[i - 1];
	for(int i = 1; i <= sz; i ++) ord[buc[len[i]] --] = i; //ord 按 len 升序
	for(int i = sz; i >= 2; i --)
	{
		int u = ord[i];
		cnt[lnk[u]] += cnt[u]; //子状态的 endpos 一定被父状态包含，直接加给 lnk
	}
}

// 两串最长公共子串：沿转移走，失配就跳 lnk 把当前匹配串缩成它的最长后缀
// 用法：ans = lcs(b);  （a 已经建好 SAM，build 不是必须的）
int lcs(const string &t)
{
	int v = 1, l = 0, best = 0;
	for(char ch : t)
	{
		int c = ch - 'a';
		while(v != 1 && !nxt[v][c])
		{
			v = lnk[v];
			l = len[v]; //缩到 lnk 代表的最长串
		}
		if(nxt[v][c]) v = nxt[v][c], l ++;
		else l = 0; //根上也没有 c 转移，只能从空串重新开始
		if(l > best) best = l;
	}
	return best;
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：后缀自动机 SAM（建自动机 + endpos + 最长公共子串） === */
const META = {
  title: '后缀自动机 SAM：建机、endpos 与最长公共子串',
  complexity: '建机 O(|a|)（转移均摊）　计数排序 O(|a|)　LCS O(|b|)',
  inputHint: '两行小写字母串：第一行 a（建 SAM），第二行 b（求最长公共子串），长度 <= 8',
  file: 'SAM.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--info)', text: '普通状态 / q = nxt[p][c]' },
    { color: 'var(--accent)', text: '当前新建或处理的 u；正在匹配的字符' },
    { color: 'var(--warn)', text: '沿 lnk 上跳的 p / 失配时跳到的 v' },
    { color: 'var(--ok)', text: 'clone 节点 / LCS 当前状态' },
    { color: 'var(--border)', text: '尚未连边的状态' },
  ],
};
const MAX_A = 8, MAX_B = 8;
const MAX_N = MAX_A;
const DEFAULT_INPUT = 'aabab\naba';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入两行：串 a 和串 b');
  const lines = text.trim().split(/\r?\n/).map((s) => s.trim()).filter((s) => s !== '');
  if (lines.length < 2) throw new Error('需要两行：串 a 和串 b');
  const a = lines[0], b = lines[1];
  if (!/^[a-z]+$/.test(a) || !/^[a-z]+$/.test(b)) throw new Error('两个串只能包含小写字母');
  if (a.length > MAX_A) throw new Error('串 a 长度需 <= ' + MAX_A + '（演示规模）');
  if (b.length > MAX_B) throw new Error('串 b 长度需 <= ' + MAX_B + '（演示规模）');
  return { a, b };
}

function randomInput() {
  const gen = (len) => {
    let s = '';
    for (let i = 0; i < len; i++) s += 'abc'[Math.floor(Math.random() * 3)];
    return s;
  };
  return gen(3 + Math.floor(Math.random() * 5)) + '\n' + gen(1 + Math.floor(Math.random() * 6));
}

function buildFrames({ a, b }) {
  const frames = [];
  const maxS = 2 * a.length + 5;
  const len = new Array(maxS).fill(0);
  const lnk = new Array(maxS).fill(0);
  const cnt = new Array(maxS).fill(0);
  const nxt = Array.from({ length: maxS }, () => ({}));
  let sz = 0, last = 0;
  const ord = [];
  let lcsV = 1, lcsL = 0, lcsBest = 0, bPos = -1;

  function ids() {
    const r = [];
    for (let id = 1; id <= sz; id++) r.push({ id, len: len[id], link: lnk[id], cnt: cnt[id] });
    return r;
  }
  function edgeList() {
    const r = [];
    for (let id = 1; id <= sz; id++) {
      for (const ch of Object.keys(nxt[id])) r.push({ u: id, v: nxt[id][ch], c: ch });
    }
    return r;
  }
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [7], phase: 'init', sz, last, states: ids(), edges: edgeList(),
    p: 0, u: 0, q: 0, clone: 0, c: '', i: -1, ord: ord.slice(),
    bPos, lcsV, lcsL, lcsBest,
  }, f));

  sz = last = 1;
  len[1] = 0; lnk[1] = 0; cnt[1] = 0;
  snap({ note: 'sam_init：sz = last = 1，根是 1 号状态，len[1] = 0，lnk[1] = 0', lines: [7, 8, 9] });

  for (let pos = 0; pos < a.length; pos++) {
    const c = a[pos];
    const p0 = last;
    const u = ++sz;
    len[u] = len[p0] + 1;
    cnt[u] = 1;
    snap({
      note: 'extend(' + c + ')：pos = ' + pos + '，p = last = ' + p0 + '，u = ++sz = ' + u + '，len[u] = len[p]+1 = ' + len[u] + '，cnt[u] = 1',
      lines: [14, 15, 16, 17], phase: 'new', u, p: p0, c, i: pos,
    });
    let p = p0;
    while (p && !nxt[p][c]) {
      nxt[p][c] = u;
      snap({
        note: 'nxt[' + p + '][' + c + '] 为空：补上 nxt[' + p + '][' + c + '] = ' + u + '，然后 p = lnk[p] = ' + lnk[p],
        lines: [18], phase: 'link', u, p, c, i: pos,
      });
      p = lnk[p];
    }
    snap({ note: '补转移循环结束：p = ' + p + (p ? '，nxt[p][' + c + '] 已存在' : '（一路补到根）'), lines: [18], phase: 'link', u, p, c, i: pos });
    if (!p) {
      lnk[u] = 1;
      snap({ note: 'p == 0：lnk[' + u + '] = 1（u 的最长真后缀只剩空串）', lines: [19], phase: 'link', u, p, c, i: pos });
    } else {
      const q = nxt[p][c];
      snap({ note: 'q = nxt[p][c] = ' + q + '，比较 len[q] = ' + len[q] + ' 与 len[p]+1 = ' + (len[p] + 1), lines: [20, 22], phase: 'q', u, p, q, c, i: pos });
      if (len[q] === len[p] + 1) {
        lnk[u] = q;
        snap({ note: 'len[q] == len[p]+1：lnk[u] = lnk[' + u + '] = ' + q, lines: [23], phase: 'q', u, p, q, c, i: pos });
      } else {
        const clone = ++sz;
        len[clone] = len[p] + 1;
        lnk[clone] = lnk[q];
        Object.assign(nxt[clone], nxt[q]);
        cnt[clone] = 0;
        snap({
          note: 'len[q] != len[p]+1，拆点：clone = ++sz = ' + clone + '，len[clone] = ' + len[clone] + '，lnk[clone] = lnk[q] = ' + lnk[q] + '，nxt[clone] 拷贝 q，cnt[clone] = 0',
          lines: [24, 26, 27, 28, 29, 30], phase: 'clone', u, p, q, clone, c, i: pos,
        });
        lnk[u] = clone;
        lnk[q] = clone;
        snap({ note: 'lnk[u] = lnk[q] = clone = ' + clone + '（u 与 q 的 endpos 分成两半）', lines: [31], phase: 'clone', u, p, q, clone, c, i: pos });
        let pp = p;
        while (pp && nxt[pp][c] === q) {
          nxt[pp][c] = clone;
          snap({
            note: 'nxt[' + pp + '][' + c + '] == q：改成 clone = ' + clone + '，pp = lnk[pp] = ' + lnk[pp],
            lines: [32], phase: 'clone', u, p: pp, q, clone, c, i: pos,
          });
          pp = lnk[pp];
        }
        snap({ note: '重定向结束，nxt 中指向 q 的 c 转移都已改到 clone', lines: [32, 33], phase: 'clone', u, p: pp, q, clone, c, i: pos });
      }
    }
    last = u;
    snap({ note: 'last = u = ' + u + '，串 a 的前 ' + (pos + 1) + ' 个字符处理完', lines: [35], phase: 'new', u, c, i: pos, last });
  }

  const total = len[last];
  const buc = new Array(total + 2).fill(0);
  snap({ note: '建完 SAM：sz = ' + sz + ' 个状态（<= 2|a|-1），total = len[last] = ' + total, lines: [43], phase: 'build' });
  for (let id = 1; id <= sz; id++) buc[len[id]]++;
  snap({ note: '按 len 计数：buc[0..' + total + '] = [' + buc.slice(0, total + 1).join(', ') + ']', lines: [44, 45], phase: 'build' });
  for (let i = 1; i <= total; i++) buc[i] += buc[i - 1];
  snap({ note: '前缀和：buc = [' + buc.slice(0, total + 1).join(', ') + ']', lines: [46], phase: 'build' });
  for (let id = 1; id <= sz; id++) ord[buc[len[id]]--] = id;
  snap({ note: 'ord 按 len 升序：' + ord.slice(1, sz + 1).join(' '), lines: [47], phase: 'build' });
  for (let i = sz; i >= 2; i--) {
    const u = ord[i];
    cnt[lnk[u]] += cnt[u];
    snap({
      note: '倒序累加：u = ord[' + i + '] = ' + u + '，cnt[lnk[u]=' + lnk[u] + '] += cnt[' + u + '] = ' + cnt[u] + ' → ' + cnt[lnk[u]],
      lines: [48, 50, 51], phase: 'count', u,
    });
  }
  snap({ note: 'endpos 大小统计完成，cnt[i] 就是状态 i 代表串的出现次数', lines: [51, 52], phase: 'count' });

  lcsV = 1; lcsL = 0; lcsBest = 0;
  snap({ note: 'lcs：v = 1，l = 0，best = 0，开始扫串 b = ' + b, lines: [59], phase: 'lcs' });
  for (let pos = 0; pos < b.length; pos++) {
    const c = b[pos];
    bPos = pos;
    snap({ note: 'b[' + pos + '] = ' + c + '：c = ' + c + '，当前 v = ' + lcsV + '，l = ' + lcsL, lines: [60, 62], phase: 'lcs', c, i: pos });
    while (lcsV !== 1 && !nxt[lcsV][c]) {
      const old = lcsV;
      lcsV = lnk[lcsV];
      lcsL = len[lcsV];
      snap({ note: 'v = ' + old + ' 没有 ' + c + ' 转移：v = lnk[v] = ' + lcsV + '，l = len[v] = ' + lcsL, lines: [63, 65, 66], phase: 'lcs', c, i: pos });
    }
    if (nxt[lcsV][c]) {
      const old = lcsV;
      lcsV = nxt[lcsV][c];
      lcsL++;
      snap({ note: 'nxt[' + old + '][' + c + '] 存在：v = ' + lcsV + '，l += 1 → ' + lcsL, lines: [68], phase: 'lcs', c, i: pos });
    } else {
      lcsL = 0;
      snap({ note: '根上也没有 ' + c + ' 转移：l = 0，从空串重新开始', lines: [69], phase: 'lcs', c, i: pos });
    }
    if (lcsL > lcsBest) {
      lcsBest = lcsL;
      snap({ note: 'l = ' + lcsL + ' > best，best 更新为 ' + lcsBest, lines: [70], phase: 'lcs', c, i: pos });
    }
  }
  snap({ note: '扫完 b：两串最长公共子串长度 = ' + lcsBest, lines: [72], phase: 'done', lcsBest });
  return frames;
}

function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');
  const sub = document.createElement('div');
  sub.className = 'sub-line';
  sub.textContent = '串 a = ' + data.a + '　状态数 sz = ' + frame.sz + '　' +
    (frame.phase === 'lcs' || frame.phase === 'done'
      ? 'LCS：v = ' + frame.lcsV + '，l = ' + frame.lcsL + '，best = ' + frame.lcsBest
      : 'last = ' + frame.last);
  box.appendChild(sub);

  const aRow = document.createElement('div');
  aRow.className = 'strip';
  for (let i = 0; i < data.a.length; i++) {
    const c = document.createElement('div');
    c.className = 'b' + (frame.phase !== 'lcs' && frame.i === i ? ' on' : '');
    c.textContent = data.a[i];
    c.style.maxWidth = '28px';
    aRow.appendChild(c);
  }
  box.appendChild(aRow);

  if (frame.phase === 'lcs' || frame.phase === 'done') {
    const bRow = document.createElement('div');
    bRow.className = 'strip';
    for (let i = 0; i < data.b.length; i++) {
      const c = document.createElement('div');
      c.className = 'b' + (frame.bPos === i ? ' on' : '');
      c.textContent = data.b[i];
      c.style.maxWidth = '28px';
      bRow.appendChild(c);
    }
    box.appendChild(bRow);
  }

  const byLen = {};
  frame.states.forEach((s) => { (byLen[s.len] = byLen[s.len] || []).push(s); });
  const pos = {};
  const maxLen = Math.max(0, ...frame.states.map((s) => s.len));
  Object.keys(byLen).forEach((k) => {
    byLen[k].forEach((s, idx) => {
      pos[s.id] = { x: 30 + Number(k) * 52, y: 34 + idx * 54 };
    });
  });
  const maxY = Math.max(60, ...Object.keys(pos).map((id) => pos[id].y));
  const W = 470, H = maxY + 46;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:500px" role="img">';
  svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--surface)"/>';
  frame.edges.forEach((e) => {
    const A = pos[e.u], B = pos[e.v];
    if (!A || !B) return;
    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
    const x1 = A.x + dx / d * 16, y1 = A.y + dy / d * 16, x2 = B.x - dx / d * 18, y2 = B.y - dy / d * 18;
    const color = (frame.phase === 'lcs' && (frame.lcsV === e.u || frame.lcsV === e.v)) ? 'var(--ok)' : 'var(--info)';
    svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="1.4" opacity="0.7"/>';
    const hx = x2 - dx / d * 7, hy = y2 - dy / d * 7;
    svg += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - dy / d * 4) + ',' + (hy + dx / d * 4) + ' ' + (hx + dy / d * 4) + ',' + (hy - dx / d * 4) + '" fill="' + color + '"/>';
    svg += '<text x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 - 3) + '" font-size="11" text-anchor="middle" fill="var(--text)">' + e.c + '</text>';
  });
  frame.states.forEach((s) => {
    const P = pos[s.id];
    let stroke = 'var(--border)', dash = '';
    if (frame.u === s.id) stroke = 'var(--accent)';
    else if (frame.clone === s.id) { stroke = 'var(--ok)'; dash = 'stroke-dasharray="4 2"'; }
    else if (frame.q === s.id) stroke = 'var(--info)';
    else if (frame.p === s.id) stroke = 'var(--warn)';
    else if (frame.phase === 'lcs' && frame.lcsV === s.id) stroke = 'var(--ok)';
    svg += '<circle cx="' + P.x + '" cy="' + P.y + '" r="15" fill="var(--surface)" stroke="' + stroke + '" stroke-width="2.5" ' + dash + '/>';
    svg += '<text x="' + P.x + '" y="' + (P.y + 4) + '" font-size="11" text-anchor="middle" fill="var(--text)">' + s.id + '</text>';
    svg += '<text x="' + P.x + '" y="' + (P.y + 27) + '" font-size="9" text-anchor="middle" fill="var(--faint)">len' + s.len + ' cnt' + s.cnt + '</text>';
  });
  svg += '</svg>';
  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  box.appendChild(wrap);

  const row = document.createElement('div');
  row.className = 'plist';
  frame.states.forEach((s) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (frame.u === s.id ? ' on' : '');
    c.textContent = s.id + ':len' + s.len + ',lnk' + s.link + ',cnt' + s.cnt;
    row.appendChild(c);
  });
  box.appendChild(row);

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'done') eq.textContent = '最长公共子串长度 = ' + frame.lcsBest;
  else if (frame.phase === 'lcs') eq.textContent = 'v = ' + frame.lcsV + '，l = ' + frame.lcsL + '，best = ' + frame.lcsBest;
  else eq.textContent = '状态按 len 分列；lnk 指向上一个 len 更小的状态，cnt 是 endpos 大小。';
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
