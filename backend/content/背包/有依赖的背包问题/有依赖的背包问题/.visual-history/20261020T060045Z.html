<style>
:root {
  --hue: 160;
  --bg: #f6f5f2; --surface: #ffffff; --text: #1f1d1a; --faint: #7a766f; --border: #e0ddd6;
  --hl: rgba(37, 99, 235, .14); --accent: hsl(var(--hue), 60%, 40%); --warn: #d97706; --ok: #16a34a; --bad: #dc2626; --info: #2563eb;
  --code-bg: #1c1a17; --code-bg-head: #26231f; --code-border: #35302a; --code-text: #e6e1d6; --code-ln: #6d675c;
  --code-comment: #7d7a68; --code-string: #d9a35f; --code-number: #c98fc0; --code-preproc: #86b8b1;
  --code-kw: hsl(var(--hue), 72%, 68%);
}
:root[data-theme="dark"] {
  --bg: #191816; --surface: #23211e; --text: #ece9e3; --faint: #9a958c; --border: #37342f;
  --hl: rgba(96, 165, 250, .22); --accent: hsl(var(--hue), 55%, 55%); --warn: #f59e0b; --ok: #4ade80; --bad: #f87171; --info: #60a5fa;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; }
.chip { font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
#stage { min-height: 220px; overflow: auto; }
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .main.has-code { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); } }
#codeWrap { min-width: 0; display: flex; flex-direction: column; background: var(--code-bg);
  border: 1px solid var(--code-border); border-radius: 8px; overflow: hidden; color: var(--code-text); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;

.code-status { display: flex; align-items: center; gap: 10px; min-width: 0; }
.status-led { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--hue), 72%, 62%); flex: none;

  0% { box-shadow: 0 0 0 0 hsl(var(--hue), 72%, 62%, .45); }
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.code-file { font: 12px/1.4 ui-monospace, Consolas, "Cascadia Mono", monospace; color: var(--code-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  border: 1px solid var(--code-border); border-radius: 4px; padding: 1px 6px; }

#legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--faint); font-size: 12px; margin-top: 8px; }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);

button:hover { border-color: var(--accent); }

button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

#error { color: var(--bad); min-height: 20px; font-size: 13px; }
footer { color: var(--faint); font-size: 12px; }

/* --- 以下仅供 render 使用的样式（背包系列） --- */
.items-box { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.pchip.on { border: 2px solid var(--accent); color: var(--text); font-weight: 700; }
.sub-line { margin-bottom: 6px; font-size: 12px; color: var(--faint); }

.dp-cell { min-width: 0; text-align: center; border-radius: 8px; padding: 3px 4px 5px; background: var(--surface); overflow: hidden; }

.dp-tag { font-size: 10px; min-height: 14px; color: var(--faint); white-space: nowrap; }
.eq-line { margin-top: 12px; font: 13px/1.7 ui-monospace, Consolas, monospace; color: var(--text); }
.tbl { display: grid; gap: 3px; margin-bottom: 4px; }
.tc { text-align: center; border-radius: 5px; padding: 1px 2px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; line-height: 1.5; }

<script type="text/plain" id="code-src">
int n, m;
int w[maxn], val[maxn], fa[maxn]; //w 是体积，val 是价值，fa 是依赖（0 表示没有依赖）
int vsz[maxn]; //vsz 是子树的体积和（不是点数，别和树形 DP 里的 sz 搞混）
vector<int> g[maxn]; //有根树：g[u] 只放儿子；森林建虚根 0 连成一棵
ll dp[maxn][maxm]; //dp[u][j]：子树 u 内、选了 u，总容量不超过 j 的最大价值，-1 表示不可达

void knap_init(int u) //只初始化自己这一行，别在 DFS 前 memset 整个二维表
{
	for(int j = 0; j <= m; j ++) dp[u][j] = -1;
	for(int j = w[u]; j <= m; j ++) dp[u][j] = val[u]; //"不超过 j"：容量够就取 u，所以整段都赋 val[u]
	vsz[u] = w[u];
}

void knap_merge(int u, int v) //把儿子 v 整棵子树当成一个物品组并进 u
{
	//j 倒序：dp[u][j - k] 必须还是"上一组"的结果；k 是分给 v 这组的容量，k = 0 就是不要这组
	//j <= min(m, vsz[u] + vsz[v])、k <= min(j - w[u], vsz[v]) 就是 sz 剪枝：
	//超出两边子树总体积的容量枚举了也没用；去掉它们就是 O(n*m^2)，n = m = 1000 时近 1e9 次内层枚举，必 TLE
	for(int j = min(m, vsz[u] + vsz[v]); j >= w[u]; j --)
		for(int k = 0; k <= min(j - w[u], vsz[v]); k ++)
			if(dp[u][j - k] >= 0 && dp[v][k] >= 0)
				dp[u][j] = max(dp[u][j], dp[u][j - k] + dp[v][k]);
	vsz[u] += vsz[v];
	//"不超过 j"每并完一组都要补尾巴：j 超过已合并总体积时取满整棵子树。
	//不补的话这些位置留的是上一轮的小值，"不要 v 这组"这个分支就丢了，答案会偏小（还会不单调）
	for(int j = vsz[u] + 1; j <= m; j ++) dp[u][j] = dp[u][vsz[u]];
}

void knap_dfs(int u) //后序：先算完所有儿子，再一组一组并进 u
{
	knap_init(u);
	for(int v : g[u])
	{
		knap_dfs(v);
		knap_merge(u, v);
	}
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：有依赖的背包问题（树形 DP，后序合并 + vsz 剪枝） === */
const META = {
  title: '有依赖的背包问题',
  complexity: '时间 O(n·m²)（vsz 剪枝后更小）　空间 O(n·m)',
  inputHint: '第一行 n m；接下来 n 行 w val fa（体积 价值 依赖的物品编号，0 表示无依赖）',
  file: '有依赖的背包问题.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '正在 DFS 的节点 / 当前格子（粗实线）' },
    { color: 'var(--ok)', text: 'dp 已算完的节点（✓）' },
    { color: 'var(--warn)', text: '参与转移的来源格（粗虚线）' },
    { color: 'var(--bad)', text: 'dp = -1 不可达（红色虚框）' },
    { color: 'var(--border)', text: '还没进入的节点（虚线圈）' },
  ],
};
const MAX_N = 6;
const MAX_M = 10;
const DEFAULT_INPUT = '4 5\n2 3 0\n3 4 1\n1 5 0\n2 9 3';

function parseInput(text) {
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  if (!lines.length) throw new Error('第一行需要 n m');
  const head = lines[0].trim().split(/\s+/).map(Number);
  if (head.length < 2) throw new Error('第一行需要两个整数：n m');
  const n = head[0], m = head[1];
  if (!Number.isInteger(n) || !Number.isInteger(m)) throw new Error('n 与 m 必须是整数');
  if (n < 1 || n > MAX_N) throw new Error('物品数 n 需在 1 到 ' + MAX_N + ' 之间（演示规模）');
  if (m < 1 || m > MAX_M) throw new Error('容量 m 需在 1 到 ' + MAX_M + ' 之间（演示规模）');
  if (lines.length - 1 < n) throw new Error('需要 ' + n + ' 行 w val fa，实际只有 ' + (lines.length - 1) + ' 行');

  const w = [0], val = [0], fa = [0];
  for (let i = 1; i <= n; i++) {
    const p = lines[i].trim().split(/\s+/).map(Number);
    if (p.length < 3 || p.some(Number.isNaN)) throw new Error('第 ' + i + ' 行需要三个整数：w val fa');
    if (p.some((x) => !Number.isInteger(x))) throw new Error('第 ' + i + ' 行的三个数必须是整数');
    if (p[0] < 1) throw new Error('第 ' + i + ' 件物品体积 w 必须 >= 1');
    if (p[0] > MAX_M) throw new Error('第 ' + i + ' 件物品体积超过演示上限 ' + MAX_M);
    if (p[1] < 0) throw new Error('第 ' + i + ' 件物品价值 val 必须 >= 0');
    if (p[2] < 0 || p[2] > n) throw new Error('第 ' + i + ' 件物品的依赖 fa 必须在 0 到 ' + n + ' 之间');
    if (p[2] === i) throw new Error('第 ' + i + ' 件物品不能依赖自己');
    w.push(p[0]); val.push(p[1]); fa.push(p[2]);
  }

  const children = {};
  for (let u = 0; u <= n; u++) children[u] = [];
  /** @type {number[]} */
  const depth = new Array(n + 1).fill(-1);
  for (let i = 1; i <= n; i++) children[fa[i]].push(i);
  const visit = (u, d) => {
    if (d > n) throw new Error('依赖关系成环了，输入不是一棵树');
    if (depth[u] >= 0) return;
    depth[u] = d;
    for (const v of children[u]) visit(v, d + 1);
  };
  visit(0, 0);
  for (let i = 1; i <= n; i++) if (depth[i] < 0) throw new Error('第 ' + i + ' 件物品的依赖链没有连到 0，不构成森林');
  return { n, m, w, val, fa, children };
}

function randomInput() {
  const n = 3 + Math.floor(Math.random() * 4);
  const m = 6 + Math.floor(Math.random() * 5);
  const rows = [];
  for (let i = 1; i <= n; i++) {
    const wt = 1 + Math.floor(Math.random() * Math.min(m, 4));
    const vv = 1 + Math.floor(Math.random() * 9);
    const f = Math.random() < 0.35 || i === 1 ? 0 : 1 + Math.floor(Math.random() * (i - 1));
    rows.push(wt + ' ' + vv + ' ' + f);
  }
  return n + ' ' + m + '\n' + rows.join('\n');
}

/* 每一帧是自包含快照：所有 dp 行、vsz、节点状态都做拷贝；lines 指向 code-src 的行号 */
function buildFrames({ n, m, w, val, children }) {
  const frames = [];
  const rows = [];
  for (let u = 0; u <= n; u++) rows.push(new Array(m + 1).fill(-1));
  const vsz = new Array(n + 1).fill(0);
  const states = {};
  for (let u = 0; u <= n; u++) states[u] = 'pending';

  const snap = (note, extra, lines) => {
    const st = {};
    for (const u in states) st[u] = states[u];
    const f = {
      note: note, phase: 'init', u: 0, v: -1, j: -1, k: -1, a: 0, b: 0, cand: 0, before: 0,
      take: false, skip: false, final: false,
      rows: rows.map((r) => r.slice()), vsz: vsz.slice(), states: st,
      lines: lines || [9],
    };
    if (extra) for (const key in extra) f[key] = extra[key];
    frames.push(f);
  };

  const push = (note, extra) => {
    const st = {};
    for (const u in states) st[u] = states[u];
    const f = Object.assign({
      note: note, phase: 'merge', u: 0, v: -1, j: -1, k: -1, a: 0, b: 0, cand: 0, before: 0,
      take: false, skip: false, final: false,
      rows: rows.map((r) => r.slice()), vsz: vsz.slice(), states: st,
    }, extra);
    frames.push(f);
  };

  const dfs = (u) => {
    states[u] = 'active';
    snap('knap_dfs(' + u + ')：先给自己这一行做 knap_init(' + u + ')', { u: u, phase: 'init' }, [31]);

    for (let j = 0; j <= m; j++) rows[u][j] = -1;
    snap('knap_init(' + u + ')：dp[' + u + '][0..' + m + '] 先全部置 -1（不可达），不在 DFS 前 memset 整张表', { u: u, phase: 'init' }, [9]);

    for (let j = w[u]; j <= m; j++) rows[u][j] = val[u];
    vsz[u] = w[u];
    snap('容量够放下第 ' + u + ' 件时 dp[' + u + '][' + w[u] + '..' + m + '] = val[' + u + '] = ' + val[u] + '；vsz[' + u + '] = ' + vsz[u],
      { u: u, phase: 'init' }, [10, 11]);

    for (const v of children[u]) {
      snap('轮到儿子 ' + v + '：先递归 knap_dfs(' + v + ') 把整棵子树算完，再合并', { u: u, v: v, phase: 'descend' }, [32, 34]);
      dfs(v);
      states[u] = 'active';
      snap('子节点 ' + v + ' 算完，开始 knap_merge(' + u + ', ' + v + ')：把 ' + v + ' 整棵子树当成一个物品组', { u: u, v: v, phase: 'merge' }, [35]);
      merge(u, v);
    }

    states[u] = 'done';
    snap('子树 ' + u + ' 处理完：dp[' + u + '] 是「选了 ' + u + ' 且已合并所有儿子」的最优值', { u: u, phase: 'done' }, [36]);
  };

  const merge = (u, v) => {
    const jMax = Math.min(m, vsz[u] + vsz[v]);
    for (let j = jMax; j >= w[u]; j--) {
      const kMax = Math.min(j - w[u], vsz[v]);
      for (let k = 0; k <= kMax; k++) {
        const a = rows[u][j - k], b = rows[v][k];
        if (a < 0 || b < 0) {
          const why = (a < 0 ? 'dp[' + u + '][' + (j - k) + '] = -1' : '') +
            (a < 0 && b < 0 ? ' 且 ' : '') +
            (b < 0 ? 'dp[' + v + '][' + k + '] = -1' : '');
          push('j = ' + j + '，k = ' + k + '：' + why + '，if 不成立，跳过这个组合',
            { phase: 'merge', u: u, v: v, j: j, k: k, a: a, b: b, cand: 0, before: rows[u][j], take: false, skip: true, lines: [19, 20, 21] });
          continue;
        }
        const before = rows[u][j];
        const cand = a + b;
        const take = cand > before;
        if (take) rows[u][j] = cand;
        push('j = ' + j + '，k = ' + k + '：dp[' + u + '][' + (j - k) + '] + dp[' + v + '][' + k + '] = ' + a + ' + ' + b + ' = ' + cand +
          (take ? ' > dp[' + u + '][' + j + '] = ' + before + '，更新' : ' <= dp[' + u + '][' + j + '] = ' + before + '，保留'),
          { phase: 'merge', u: u, v: v, j: j, k: k, a: a, b: b, cand: cand, before: before, take: take, skip: false, lines: [19, 20, 21, 22] });
      }
    }

    vsz[u] += vsz[v];
    push('vsz[' + u + '] += vsz[' + v + '] → ' + vsz[u] + '：这是已合并进来的子树总体积，后面用它做剪枝上界',
      { phase: 'vsz', u: u, v: v, lines: [23] });

    for (let j = vsz[u] + 1; j <= m; j++) {
      rows[u][j] = rows[u][vsz[u]];
      push('补尾巴：j = ' + j + ' 已超过合并后的总体积 ' + vsz[u] + '，dp[' + u + '][' + j + '] = dp[' + u + '][' + vsz[u] + '] = ' + rows[u][j],
        { phase: 'tail', u: u, v: v, j: j, lines: [26] });
    }
  };

  snap('建图完成：0 是虚根（w = val = 0，但同样必选），所有无依赖的物品都挂在它底下', { u: 0, phase: 'init' }, [4]);
  dfs(0);

  frames.push({
    note: 'knap_dfs(0) 结束：dp[0][' + m + '] = ' + rows[0][m] + '，「不超过 m」语义下这就是答案',
    phase: 'final', u: 0, v: -1, j: m, k: -1, a: 0, b: 0, cand: 0, before: 0,
    take: false, skip: false, final: true,
    rows: rows.map((r) => r.slice()), vsz: vsz.slice(), states: (() => { const st = {}; for (const u in states) st[u] = states[u]; return st; })(),
    lines: [37],
  });
  return frames;
}

/* 只根据 frame 与 data 绘制，不修改它们，也不在这里做算法计算 */
function render(frame, stage, data) {
  const n = data.n, m = data.m, w = data.w, val = data.val;
  stage.innerHTML = '';
  const box = document.createElement('div');

  const tree = document.createElement('div');
  const pos = layoutTree(0, data.children, 46, 54);
  const nodes = Object.keys(pos).map(Number);
  let svg = '<svg viewBox="' + svgBox(nodes.map((u) => pos[u]), 34) + '" style="width:100%;height:auto;max-height:210px">';
  for (const u of nodes) {
    for (const v of data.children[u]) {
      svg += edgeSvg(pos[u], pos[v], { r: 15, color: 'var(--border)', width: 2 });
    }
  }
  for (const u of nodes) {
    const st = frame.states[u] || 'pending';
    const stroke = st === 'active' ? 'var(--accent)' : st === 'done' ? 'var(--ok)' : 'var(--border)';
    const bw = st === 'active' ? 3 : 2;
    const dash = st === 'pending' ? ' stroke-dasharray="5 4"' : '';
    svg += '<circle cx="' + pos[u].x + '" cy="' + pos[u].y + '" r="15" fill="var(--surface)" stroke="' + stroke +
      '" stroke-width="' + bw + '"' + dash + '/>';
    svg += textSvg(pos[u].x, pos[u].y + 4, String(u), { size: 12, weight: 700 });
    svg += textSvg(pos[u].x, pos[u].y + 28, 'w' + w[u] + ' v' + val[u], { size: 9, fill: 'var(--faint)' });
    if (st === 'active') svg += textSvg(pos[u].x, pos[u].y - 20, '当前', { size: 9, fill: 'var(--accent)' });
    if (st === 'done') svg += textSvg(pos[u].x + 15, pos[u].y - 11, '✓', { size: 10, fill: 'var(--ok)' });
  }
  svg += '</svg>';
  tree.innerHTML = svg;
  box.appendChild(tree);

  const info = document.createElement('div');
  info.className = 'sub-line';
  const u = frame.u, v = frame.v;
  info.textContent = 'u = ' + u + '：w=' + w[u] + ' val=' + val[u] + ' vsz=' + frame.vsz[u] +
    (v >= 0 ? '　|　v = ' + v + '：w=' + w[v] + ' val=' + val[v] + ' vsz=' + frame.vsz[v] : '');
  box.appendChild(info);

  const dpRow = (label, arr, opts) => {
    const wrap = document.createElement('div');
    const sub = document.createElement('div');
    sub.className = 'sub-line';
    sub.textContent = label;
    wrap.appendChild(sub);
    const row = document.createElement('div');
    row.className = 'dp-row';
    for (let j = 0; j <= m; j++) {
      const cell = document.createElement('div');
      cell.className = 'dp-cell';
      const empty = arr[j] < 0;
      let border = empty ? '1px dashed var(--bad)' : '1px solid var(--border)';
      let tag = empty ? '不可达' : '可达';
      let color = empty ? 'var(--bad)' : 'var(--text)';
      if (opts.cur === j) { border = '3px solid var(--info)'; tag = 'j'; color = 'var(--text)'; }
      if (opts.src !== undefined && opts.src === j) { border = '3px dashed var(--warn)'; tag = 'j-k'; color = 'var(--text)'; }
      if (opts.k !== undefined && opts.k === j) { border = '3px dashed var(--warn)'; tag = 'k'; color = 'var(--text)'; }
      if (frame.final && opts.answer && j === m) { border = '3px solid var(--accent)'; tag = '答案'; color = 'var(--text)'; }
      cell.style.border = border;
      const idx = document.createElement('div');
      idx.className = 'dp-idx';
      idx.textContent = 'j=' + j;
      const value = document.createElement('div');
      value.className = 'dp-val';
      value.textContent = String(arr[j]);
      value.style.color = color;
      const tg = document.createElement('div');
      tg.className = 'dp-tag';
      tg.textContent = tag;
      cell.appendChild(idx);
      cell.appendChild(value);
      cell.appendChild(tg);
      row.appendChild(cell);
    }
    wrap.appendChild(row);
    return wrap;
  };

  const merging = frame.phase === 'merge' || frame.phase === 'vsz' || frame.phase === 'tail';
  box.appendChild(dpRow('dp[' + u + ']：子树 ' + u + ' 内、选了 ' + u + '、容量不超过 j 的最大价值（-1 表示不可达）',
    frame.rows[u],
    { cur: frame.j >= 0 && frame.phase !== 'tail' ? frame.j : undefined, src: frame.k >= 0 ? frame.j - frame.k : undefined, answer: true }));
  if (merging && v >= 0) {
    box.appendChild(dpRow('dp[' + v + ']：整棵子树 ' + v + ' 的结果，合并时把它当成一组', frame.rows[v], { k: frame.k >= 0 ? frame.k : undefined }));
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'merge' && frame.skip) {
    eq.textContent = 'if (dp[' + u + '][j - k] >= 0 && dp[' + v + '][k] >= 0) 不成立，这对 (j, k) 不能转移';
  } else if (frame.phase === 'merge') {
    eq.textContent = 'dp[' + u + '][' + frame.j + '] = max(dp[' + u + '][' + frame.j + '], dp[' + u + '][' + (frame.j - frame.k) + '] + dp[' + v + '][' + frame.k + ']) = max(' +
      frame.before + ', ' + frame.a + ' + ' + frame.b + ') → ' + frame.rows[u][frame.j];
  } else if (frame.phase === 'tail') {
    eq.textContent = 'j = ' + frame.j + ' > vsz[' + u + '] = ' + frame.vsz[u] + '，整棵子树都装得下，取满：dp[' + u + '][' + frame.j + '] = ' + frame.rows[u][frame.j];
  } else if (frame.phase === 'vsz') {
    eq.textContent = 'vsz[' + u + '] = ' + frame.vsz[u] + '；后面 j 的上界取 min(m, vsz[u] + vsz[v])，k 的上界取 min(j - w[u], vsz[v])';
  } else if (frame.final) {
    eq.textContent = '答案 dp[0][' + m + '] = ' + frame.rows[0][m] + '（0 是虚根，选它不占体积）';
  } else {
    eq.textContent = 'dp[u][j] 表示「选了 u、且只用子树 u 里的物品、总容量不超过 j」的最大价值；-1 表示这种容量不可达。';
  }
  box.appendChild(eq);

  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
