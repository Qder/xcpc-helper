<style>
:root {
  --hue: 160;
  --bg: #f6f5f2; --surface: #ffffff; --text: #1f1d1a; --faint: #7a766f; --border: #e0ddd6;
  --hl: rgba(37, 99, 235, .14); --accent: hsl(var(--hue), 60%, 40%); --warn: #d97706; --ok: #16a34a; --bad: #dc2626; --info: #2563eb;
  --code-bg: #1c1a17; --code-bg-head: #26231f; --code-border: #35302a; --code-text: #e6e1d6; --code-ln: #6d675c;
  --code-comment: #7d7a68; --code-string: #d9a35f; --code-number: #c98fc0; --code-preproc: #86b8b1;
  --code-kw: hsl(var(--hue), 72%, 68%);
}
:root[data-theme="dark"] {
  --bg: #191816; --surface: #23211e; --text: #ece9e3; --faint: #9a958c; --border: #37342f;
  --hl: rgba(96, 165, 250, .22); --accent: hsl(var(--hue), 55%, 55%); --warn: #f59e0b; --ok: #4ade80; --bad: #f87171; --info: #60a5fa;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; }
.chip { font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
#stage { min-height: 220px; overflow: auto; }
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .main.has-code { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); } }
#codeWrap { min-width: 0; display: flex; flex-direction: column; background: var(--code-bg);
  border: 1px solid var(--code-border); border-radius: 8px; overflow: hidden; color: var(--code-text); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; background: var(--code-bg-head); border-bottom: 1px solid var(--code-border); flex: none; }
.code-status { display: flex; align-items: center; gap: 10px; min-width: 0; }
.status-led { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--hue), 72%, 62%); flex: none;
  animation: led-pulse 2.2s ease-out infinite; }
@keyframes led-pulse {
  0% { box-shadow: 0 0 0 0 hsl(var(--hue), 72%, 62%, .45); }
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.code-file { font: 12px/1.4 ui-monospace, Consolas, "Cascadia Mono", monospace; color: var(--code-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-lang { font: 10.5px/1.4 ui-monospace, Consolas, monospace; color: var(--code-ln);

.ln { display: flex; white-space: pre; border-left: 3px solid transparent; padding-right: 16px; }

#note { min-height: 24px; font-weight: 600; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--faint); font-size: 12px; margin-top: 8px; }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 12px; min-height: 32px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type=range] { accent-color: var(--accent); }
#progress { flex: 1 1 200px; min-width: 120px; }
textarea { width: 100%; min-height: 60px; font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }

/* --- 以下仅供 render 使用的样式（背包系列） --- */
.items-box { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.item-chip { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; color: var(--faint); }

.eq-line { margin-top: 12px; font: 13px/1.7 ui-monospace, Consolas, monospace; color: var(--text); }

<script type="text/plain" id="code-src">
int n, m;
int v[maxn], w[maxn];
ll dp[maxn][maxm];

int main()
{
	ios::sync_with_stdio(false);
	cin.tie(0); cout.tie(0);
	
	cin >> n >> m;
	for(int i = 1; i <= n; i ++) cin >> v[i] >> w[i];
	
	//倒着做 DP：dp[i][j] = 从第 i 件到第 n 件里选、容量 j 的最大价值
	for(int i = n; i >= 1; i --)
		for(int j = 0; j <= m; j ++)
		{
			dp[i][j] = dp[i + 1][j];
			if(j >= v[i]) dp[i][j] = max(dp[i][j], dp[i + 1][j - v[i]] + w[i]);
		}
	
	//正着回溯：能选就选，这样得到的方案字典序最小
	int tmpv = m;
	for(int i = 1; i <= n; i ++)
		if(tmpv >= v[i] && dp[i][tmpv] == dp[i + 1][tmpv - v[i]] + w[i])
		{
			cout << i << ' ';
			tmpv -= v[i];
		}
	return 0;
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：背包问题求具体方案（倒着 DP，正着回溯） === */
const META = {
  title: '背包问题求具体方案',
  complexity: '时间 O(n·m)　空间 O(n·m)',
  inputHint: '第一行 n m；接下来 n 行 v w（体积 价值）',
  file: '背包问题求具体方案.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--info)', text: '当前格子（粗实线）' },
    { color: 'var(--warn)', text: '依赖的下一行格子（粗虚线）' },
    { color: 'var(--ok)', text: '回溯选中的物品 / 递归依赖' },
    { color: 'var(--accent)', text: '答案格 dp[1][m]' },
    { color: 'var(--border)', text: '未填 / 未涉及' },
  ],
};
const MAX_N = 5;
const MAX_M = 10;
const DEFAULT_INPUT = '3 5\n1 3\n2 5\n4 6';

function parseInput(text) {
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  if (!lines.length) throw new Error('第一行需要 n m');
  const head = lines[0].trim().split(/\s+/).map(Number);
  if (head.length < 2) throw new Error('第一行需要两个整数：n m');
  const n = head[0], m = head[1];
  if (!Number.isInteger(n) || !Number.isInteger(m)) throw new Error('n 与 m 必须是整数');
  if (n < 1 || n > MAX_N) throw new Error('物品数 n 需在 1 到 ' + MAX_N + ' 之间（演示规模）');
  if (m < 0 || m > MAX_M) throw new Error('容量 m 需在 0 到 ' + MAX_M + ' 之间（演示规模）');
  if (lines.length - 1 < n) throw new Error('需要 ' + n + ' 行 v w，实际只有 ' + (lines.length - 1) + ' 行');
  const items = [];
  for (let i = 0; i < n; i++) {
    const p = lines[i + 1].trim().split(/\s+/).map(Number);
    if (p.length < 2 || p.some(Number.isNaN)) throw new Error('第 ' + (i + 1) + ' 件物品需要两个整数：v w');
    if (!Number.isInteger(p[0]) || !Number.isInteger(p[1])) throw new Error('第 ' + (i + 1) + ' 件物品的 v w 必须是整数');
    if (p[0] < 1) throw new Error('第 ' + (i + 1) + ' 件物品体积 v 必须 >= 1');
    if (p[1] < 0) throw new Error('第 ' + (i + 1) + ' 件物品价值 w 必须 >= 0');
    if (p[0] > MAX_M) throw new Error('第 ' + (i + 1) + ' 件物品体积超过演示上限 ' + MAX_M);
    items.push([p[0], p[1]]);
  }
  return { n, m, items };
}

function randomInput() {
  const n = 2 + Math.floor(Math.random() * 4);
  const m = 5 + Math.floor(Math.random() * 6);
  const rows = [];
  for (let i = 0; i < n; i++) {
    const v = 1 + Math.floor(Math.random() * Math.min(m, 4));
    const w = 1 + Math.floor(Math.random() * 9);
    rows.push(v + ' ' + w);
  }
  return n + ' ' + m + '\n' + rows.join('\n');
}

/* 每一帧是自包含快照：二维表逐行拷贝；chosen 也拷贝；lines 指向 code-src 的行号 */
function buildFrames({ n, m, items }) {
  const frames = [];
  const vv = [0], ww = [0];
  for (let i = 0; i < n; i++) { vv.push(items[i][0]); ww.push(items[i][1]); }

  const dp = [];
  for (let i = 0; i <= n + 1; i++) dp.push(new Array(m + 1).fill(0));

  const snap = (note, extra, lines) => {
    const f = {
      note: note, phase: 'dp', i: 0, j: -1, src1: -1, src2: -1, cand: 0, before: 0, take: false,
      table: dp.map((r) => r.slice()), tmpv: -1, chosen: [], final: false, lines: lines || [3],
    };
    if (extra) for (const key in extra) f[key] = extra[key];
    if (extra && extra.chosen) f.chosen = extra.chosen.slice();
    frames.push(f);
  };

  snap('初始：dp[n+1][0..m] 全为 0（全局数组），这一行是「一件都不选」的边界', {}, [3]);

  for (let i = n; i >= 1; i--) {
    if (vv[i] > m) {
      snap('第 ' + i + ' 行：v[' + i + '] = ' + vv[i] + ' > m = ' + m + '，整行只能继承下一行', { i: i }, [14]);
    } else {
      snap('第 ' + i + ' 行：dp[' + i + '][j] 表示「从第 ' + i + ' 件到第 ' + n + ' 件里选、容量 j」的最大价值，j 从 0 正向枚举', { i: i }, [14]);
    }
    for (let j = 0; j <= m; j++) {
      dp[i][j] = dp[i + 1][j];
      if (j < vv[i]) {
        frames.push({
          note: 'j = ' + j + ' < v[' + i + '] = ' + vv[i] + '：放不下，dp[' + i + '][' + j + '] = dp[' + (i + 1) + '][' + j + '] = ' + dp[i][j],
          phase: 'dp', i: i, j: j, src1: j, src2: -1, cand: 0, before: dp[i][j], take: false,
          table: dp.map((r) => r.slice()), tmpv: -1, chosen: [], final: false, lines: [15, 17],
        });
        continue;
      }
      const base = dp[i + 1][j];
      const alt = dp[i + 1][j - vv[i]] + ww[i];
      const take = alt > base;
      if (take) dp[i][j] = alt;
      frames.push({
        note: 'j = ' + j + '：dp[' + (i + 1) + '][' + j + '] = ' + base + '，dp[' + (i + 1) + '][' + (j - vv[i]) + '] + ' + ww[i] + ' = ' +
          alt + (take ? ' 更大，取它 → ' + dp[i][j] : ' 不比原来大，保留 ' + base),
        phase: 'dp', i: i, j: j, src1: j, src2: j - vv[i], cand: alt, before: base, take: take,
        table: dp.map((r) => r.slice()), tmpv: -1, chosen: [], final: false, lines: [15, 17, 18],
      });
    }
  }

  const chosen = [];
  let tmpv = m;
  snap('DP 填完，开始正序回溯：tmpv = m = ' + m + '，从第 1 件往后看，能选就选', { phase: 'back', tmpv: tmpv }, [22]);

  for (let i = 1; i <= n; i++) {
    const enough = tmpv >= vv[i];
    const ok = enough && dp[i][tmpv] === dp[i + 1][tmpv - vv[i]] + ww[i];
    frames.push({
      note: enough
        ? 'i = ' + i + '：tmpv = ' + tmpv + ' >= v[' + i + '] = ' + vv[i] + '，比较 dp[' + i + '][' + tmpv + '] = ' + dp[i][tmpv] +
          ' 与 dp[' + (i + 1) + '][' + (tmpv - vv[i]) + '] + ' + ww[i] + ' = ' + (dp[i + 1][tmpv - vv[i]] + ww[i]) +
          (ok ? '，相等 → 选它' : '，不等 → 跳过')
        : 'i = ' + i + '：tmpv = ' + tmpv + ' < v[' + i + '] = ' + vv[i] + '，容量不够，跳过',
      phase: 'back', i: i, j: tmpv, src1: -1, src2: enough ? tmpv - vv[i] : -1, cand: 0, before: 0, take: ok,
      table: dp.map((r) => r.slice()), tmpv: tmpv, chosen: chosen.slice(), final: false, lines: [23, 24],
    });
    if (ok) {
      chosen.push(i);
      tmpv -= vv[i];
      frames.push({
        note: '选中第 ' + i + ' 件，tmpv -= v[' + i + '] → tmpv = ' + tmpv,
        phase: 'back', i: i, j: -1, src1: -1, src2: -1, cand: 0, before: 0, take: false,
        table: dp.map((r) => r.slice()), tmpv: tmpv, chosen: chosen.slice(), final: false, lines: [26, 27],
      });
    }
  }

  frames.push({
    note: '结束：方案是 ' + (chosen.length ? chosen.join(' ') : '（空）') + '，最大价值 dp[1][' + m + '] = ' + dp[1][m],
    phase: 'final', i: 1, j: m, src1: -1, src2: -1, cand: 0, before: 0, take: false,
    table: dp.map((r) => r.slice()), tmpv: tmpv, chosen: chosen.slice(), final: true, lines: [29],
  });
  return frames;
}

/* 只根据 frame 与 data 绘制，不修改它们，也不在这里做算法计算 */
function render(frame, stage, data) {
  const items = data.items, n = data.n, m = data.m;
  stage.innerHTML = '';
  const box = document.createElement('div');

  const chips = document.createElement('div');
  chips.className = 'items-box';
  items.forEach((it, k) => {
    const id = k + 1;
    const picked = frame.chosen.indexOf(id) >= 0;
    const c = document.createElement('span');
    c.className = 'item-chip' + (picked ? ' picked' : frame.phase === 'dp' && frame.i === id ? ' on' : '');
    c.textContent = '第 ' + id + ' 件：v=' + it[0] + ' w=' + it[1] + (picked ? ' ✓' : '');
    chips.appendChild(c);
  });
  box.appendChild(chips);

  const tbl = document.createElement('div');
  tbl.className = 'tbl';
  tbl.style.gridTemplateColumns = '38px repeat(' + (m + 1) + ', minmax(24px, 1fr))';
  const head = document.createElement('div');
  head.className = 'hd';
  head.textContent = 'i\\j';
  tbl.appendChild(head);
  for (let j = 0; j <= m; j++) {
    const h = document.createElement('div');
    h.className = 'hd';
    h.textContent = String(j);
    tbl.appendChild(h);
  }
  for (let i = 1; i <= n + 1; i++) {
    const rl = document.createElement('div');
    rl.className = 'rl';
    rl.textContent = i === n + 1 ? 'n+1' : String(i);
    tbl.appendChild(rl);
    for (let j = 0; j <= m; j++) {
      const cell = document.createElement('div');
      cell.className = 'tc';
      let border = '1px solid var(--border)';
      let color = 'var(--text)';
      let bg = 'var(--surface)';
      if (frame.phase === 'dp' && frame.i === i && frame.j === j) {
        border = '2px solid var(--info)';
      } else if (frame.phase === 'dp' && frame.i + 1 === i && (j === frame.src1 || j === frame.src2)) {
        border = '2px dashed var(--warn)';
      } else if (frame.phase === 'back' && frame.j === j && frame.i === i) {
        border = '2px solid var(--info)';
      } else if (frame.phase === 'back' && frame.i + 1 === i && j === frame.src2) {
        border = '2px dashed var(--warn)';
      }
      if (i === n + 1) {
        color = 'var(--faint)';
        bg = 'var(--bg)';
      }
      if (frame.chosen.indexOf(i) >= 0 && i <= n) color = 'var(--ok)';
      if (frame.final && i === 1 && j === m) {
        border = '2px solid var(--accent)';
        color = 'var(--text)';
      }
      cell.style.border = border;
      cell.style.background = bg;
      cell.style.color = color;
      cell.textContent = String(frame.table[i][j]);
      tbl.appendChild(cell);
    }
  }
  box.appendChild(tbl);

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'dp' && frame.j >= 0) {
    eq.textContent = frame.src2 < 0
      ? 'dp[' + frame.i + '][' + frame.j + '] = dp[' + (frame.i + 1) + '][' + frame.j + '] = ' + frame.before
      : 'dp[' + frame.i + '][' + frame.j + '] = max(dp[' + (frame.i + 1) + '][' + frame.j + '], dp[' + (frame.i + 1) + '][' +
        frame.src2 + '] + ' + data.items[frame.i - 1][1] + ') = max(' + frame.before + ', ' + frame.cand + ') → ' +
        frame.table[frame.i][frame.j];
  } else if (frame.phase === 'back') {
    eq.textContent = 'tmpv = ' + frame.tmpv + '；判断 dp[' + frame.i + '][tmpv] == dp[' + (frame.i + 1) + '][tmpv - v[' + frame.i + ']] + w[' + frame.i + ']' +
      (frame.take ? '　成立 → 选第 ' + frame.i + ' 件' : '　不成立 → 跳过');
  } else if (frame.final) {
    eq.textContent = '字典序最小的最优方案：' + (frame.chosen.length ? frame.chosen.join(' ') : '（空）') + '，总价值 ' + frame.table[1][m];
  } else {
    eq.textContent = 'dp 从后往前填，回溯从前往后走：这样编号小的物品会被优先选中，方案字典序最小。';
  }
  box.appendChild(eq);

  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
