struct Point { long double x, y; };

bool cmp_point(const Point &a, const Point &b)
{
	return a.x != b.x ? a.x < b.x : a.y < b.y; //先按 x，再按 y
}

// 叉积 > 0：o -> a -> b 左转；= 0：三点共线；< 0：右转
long double cross(const Point &o, const Point &a, const Point &b)
{
	return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
}

long double dist(const Point &a, const Point &b)
{
	long double dx = a.x - b.x, dy = a.y - b.y;
	return sqrt(dx * dx + dy * dy);
}

bool same_point(const Point &a, const Point &b) { return a.x == b.x && a.y == b.y; }

// 用法：传入所有点，返回凸包周长（逆时针，重复点先去重，共线点被丢掉）。
// 点数 <= 1 返回 0；只有两个不同点时返回两点距离的 2 倍（退化成一个来回的线段）。
// 若需要凸包顶点序列而不是周长，把最后的求和换成返回 h 即可。
long double convex_hull_perimeter(vector<Point> p)
{
	sort(p.begin(), p.end(), cmp_point);
	p.erase(unique(p.begin(), p.end(), same_point), p.end()); //重复点会让叉积判断退化
	int n = (int)p.size();
	if(n <= 1) return 0;
	vector<Point> h(2 * n); //凸包上最多 2n 个点（上下链各一遍）
	int k = 0;
	//下凸壳：保持左转，cross <= 0 说明右转或共线，弹栈
	for(int i = 0; i < n; i ++)
	{
		while(k >= 2 && cross(h[k - 2], h[k - 1], p[i]) <= 0) k --;
		h[k ++] = p[i];
	}
	//上凸壳：从右往左再扫一遍，t 是本轮下界，防止把下凸壳的点弹掉
	for(int i = n - 2, t = k + 1; i >= 0; i --)
	{
		while(k >= t && cross(h[k - 2], h[k - 1], p[i]) <= 0) k --;
		h[k ++] = p[i];
	}
	h.resize(k - 1); //首尾各存了一次起点，去掉最后一个
	long double res = 0;
	for(int i = 0; i < (int)h.size(); i ++) res += dist(h[i], h[(i + 1) % h.size()]);
	return res;
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：只允许修改这一段（示例：二分查找） === */
const META = {
  title: '二维凸包（Andrew 单调链）',
  complexity: '时间 O(n log n)　空间 O(n)',
  inputHint: '第一行 n；随后 n 行 x y（整数或两位小数，可重复）',
  file: '二维凸包.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前点 / 栈顶连线' },
    { color: 'var(--ok)', text: '栈中的凸壳点' },
    { color: 'var(--bad)', text: '被弹出的点' },
    { color: 'var(--border)', text: '尚未处理的点' },
  ],
};
const MAX_N = 12;
const DEFAULT_INPUT = '4\n4 8\n4 12\n5 9.3\n7 8';

// code-src 中的关键行（从 1 开始）
const L = {
  sort: 27, dedupe: 28, lower: 34, lowerPop: 36, lowerPush: 37,
  upper: 40, upperPop: 42, upperPush: 43, resize: 45, perimeter: 47, done: 48,
};

function parseInput(text) {
  const lines = text.trim().split(/\r?\n/);
  const n = Number((lines[0] || '').trim());
  if (!Number.isInteger(n) || n < 1 || n > MAX_N) throw new Error('点数 n 需为 1 到 ' + MAX_N + ' 的整数');
  if (lines.length - 1 < n) throw new Error('需要 ' + n + ' 行坐标');
  const points = [];
  for (let i = 0; i < n; i++) {
    const p = (lines[i + 1] || '').trim().split(/\s+/).map(Number);
    if (p.length !== 2 || p.some(Number.isNaN)) throw new Error('第 ' + (i + 2) + ' 行需要两个数字：x y');
    const [x, y] = p;
    if (x < -30 || x > 30 || y < -30 || y > 30) throw new Error('坐标需在 -30 到 30 之间');
    points.push({ x, y, id: i + 1 });
  }
  return { points };
}

function randomInput() {
  const n = 4 + Math.floor(Math.random() * 5);
  const lines = [String(n)];
  for (let i = 0; i < n; i++) lines.push((Math.floor(Math.random() * 17) - 8) + ' ' + (Math.floor(Math.random() * 17) - 8));
  return lines.join('\n');
}

const crossOf = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
const distOf = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* 每一帧都是自包含快照：stack / popped / 计数全部拷贝 */
function buildFrames(data) {
  const frames = [];
  const sorted = data.points.slice().sort((a, b) => (a.x !== b.x ? a.x - b.x : a.y - b.y));
  const pts = [];
  sorted.forEach((p) => {
    const last = pts[pts.length - 1];
    if (!last || last.x !== p.x || last.y !== p.y) pts.push(p);
  });
  const n = pts.length;
  const stack = [];
  let k = 0;

  const snap = (note, phase, extra) => frames.push(Object.assign({
    note, phase, stack: stack.slice(0, k), k, popped: -1, cur: -1,
    crossVal: null, limit: null, perimeter: null,
  }, extra));

  snap('按 x、y 排序并去掉重复点，共剩 ' + n + ' 个点；准备从左到右扫下凸壳', 'init', { lines: [L.sort, L.dedupe] });
  if (n <= 1) {
    snap('点数 <= 1，凸包周长为 0', 'done', { perimeter: 0, lines: [L.done] });
    return frames;
  }

  for (let i = 0; i < n; i++) {
    snap('下凸壳：考察 p[' + i + '] = (' + pts[i].x + ', ' + pts[i].y + ')', 'lower', { i, cur: i, lines: [L.lower] });
    while (k >= 2) {
      const c = crossOf(pts[stack[k - 2]], pts[stack[k - 1]], pts[i]);
      snap('cross(h[k-2], h[k-1], p[' + i + ']) = ' + c.toFixed(2) + (c <= 0 ? ' <= 0：栈顶右转/共线，弹出' : ' > 0：保留左转'), 'lower', {
        i, cur: i, crossVal: c, popped: c <= 0 ? stack[k - 1] : -1, lines: c <= 0 ? [L.lowerPop] : [L.lowerPop],
      });
      if (c > 0) break;
      k--;
      stack.length = k;
    }
    stack[k] = i;
    k++;
    snap('p[' + i + '] 入栈，栈中现在有 ' + k + ' 个点', 'lower', { i, cur: i, lines: [L.lowerPush] });
  }

  const limit = k + 1;
  snap('下凸壳完成（k = ' + k + '）；上凸壳从 i = n-2 往回扫，下界 t = ' + limit, 'upper', { limit, lines: [L.upper] });
  for (let i = n - 2; i >= 0; i--) {
    snap('上凸壳：考察 p[' + i + '] = (' + pts[i].x + ', ' + pts[i].y + ')', 'upper', { i, cur: i, limit, lines: [L.upper] });
    while (k >= limit) {
      const c = crossOf(pts[stack[k - 2]], pts[stack[k - 1]], pts[i]);
      snap('cross(h[k-2], h[k-1], p[' + i + ']) = ' + c.toFixed(2) + (c <= 0 ? ' <= 0：弹出栈顶' : ' > 0：保留左转'), 'upper', {
        i, cur: i, limit, crossVal: c, popped: c <= 0 ? stack[k - 1] : -1, lines: [L.upperPop],
      });
      if (c > 0) break;
      k--;
      stack.length = k;
    }
    stack[k] = i;
    k++;
    snap('p[' + i + '] 入栈，栈中现在有 ' + k + ' 个点', 'upper', { i, cur: i, limit, lines: [L.upperPush] });
  }

  k--;
  stack.length = k;
  snap('h.resize(k - 1)：去掉首尾重复的起点，凸包共 ' + k + ' 个顶点', 'hull', { lines: [L.resize] });
  let perimeter = 0;
  for (let i = 0; i < k; i++) perimeter += distOf(pts[stack[i]], pts[stack[(i + 1) % k]]);
  snap('沿凸包累加相邻点距离，周长 = ' + perimeter.toFixed(2), 'done', { perimeter, lines: [L.perimeter, L.done] });
  return frames;
}

/* 只根据 frame 与 data 绘制，不修改它们 */
function render(frame, stage, data) {
  const sorted = data.points.slice().sort((a, b) => (a.x !== b.x ? a.x - b.x : a.y - b.y));
  const pts = [];
  sorted.forEach((p) => {
    const last = pts[pts.length - 1];
    if (!last || last.x !== p.x || last.y !== p.y) pts.push(p);
  });
  const W = 560, H = 360, PAD = 48;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(1e-6, maxX - minX), spanY = Math.max(1e-6, maxY - minY);
  const scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
  const ox = (W - spanX * scale) / 2, oy = (H - spanY * scale) / 2;
  const pos = pts.map((p) => ({ x: ox + (p.x - minX) * scale, y: H - oy - (p.y - minY) * scale }));

  const svg = [];
  svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:360px" role="img" aria-label="凸包示意图">');
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      svg.push('<line x1="' + pos[i].x + '" y1="' + pos[i].y + '" x2="' + pos[j].x + '" y2="' + pos[j].y + '" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 4"/>');
    }
  }
  const st = frame.stack || [];
  for (let i = 0; i + 1 < st.length; i++) {
    svg.push(edgeSvg(pos[st[i]], pos[st[i + 1]], { r: 6, color: 'var(--accent)', width: 3 }));
  }
  if (frame.phase === 'done' && st.length > 2) {
    svg.push(edgeSvg(pos[st[st.length - 1]], pos[st[0]], { r: 6, color: 'var(--ok)', width: 3 }));
  }
  for (let i = 0; i < pts.length; i++) {
    const onStack = st.indexOf(i) >= 0;
    const popped = frame.popped === i;
    const cur = frame.cur === i;
    let color = 'var(--faint)', r = 5, width = 2;
    if (onStack) { color = 'var(--ok)'; r = 6; }
    if (popped) { color = 'var(--bad)'; r = 7; width = 3; }
    if (cur) { color = 'var(--accent)'; r = 8; width = 3; }
    svg.push('<circle cx="' + pos[i].x + '" cy="' + pos[i].y + '" r="' + r + '" fill="' + (onStack || cur ? color : 'var(--surface)') + '" stroke="' + color + '" stroke-width="' + width + '"/>');
    svg.push(textSvg(pos[i].x + 11, pos[i].y - 9, i + ' ( ' + pts[i].x + ',' + pts[i].y + ' )', { size: 10, fill: 'var(--faint)', anchor: 'start' }));
  }
  svg.push('</svg>');
  stage.innerHTML = svg.join('');

  const info = document.createElement('div');
  info.style.cssText = 'margin-top:8px;font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:14px';
  info.innerHTML = '<span>栈：' + (st.length ? st.map((i) => '(' + pts[i].x + ',' + pts[i].y + ')').join(' → ') : '空') + '</span>' +
    (frame.crossVal !== null ? '<span>cross = ' + frame.crossVal.toFixed(2) + '</span>' : '') +
    (frame.perimeter !== null ? '<span style="color:var(--ok)">周长 = ' + frame.perimeter.toFixed(2) + '</span>' : '');
  stage.appendChild(info);
}
/* === ALGO END === */

/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
