<style>
:root {
  --hue: 160;

:root[data-theme="dark"] {

<script type="text/plain" id="code-src">
__int128 cross(const Point &a, const Point &b, const Point &c)
{
	return (__int128)(b.x - a.x) * (c.y - a.y) - (__int128)(b.y - a.y) * (c.x - a.x);
}

ll dist2(const Point &a, const Point &b)
{
	ll dx = a.x - b.x, dy = a.y - b.y;
	return dx * dx + dy * dy;
}

// Andrew 单调链：排序去重后先扫下凸壳、再扫上凸壳，O(n log n)。
// cross <= 0 就弹栈：共线点不留，保证凸包上相邻三点都是严格拐角。
int convex_hull()
{
	sort(p + 1, p + n + 1);
	m = 0;
	for(int i = 1; i <= n; i ++)
		if(i == 1 || !(p[i] == p[i - 1])) q[++ m] = p[i]; //重复点只留一个
	if(m == 1) { hull[1] = q[1]; return 1; }
	h = 0;
	for(int i = 1; i <= m; i ++)
	{
		while(h >= 2 && cross(hull[h - 1], hull[h], q[i]) <= 0) h --;
		hull[++ h] = q[i];
	}
	for(int i = m - 1, t = h + 1; i >= 1; i --)
	{
		while(h >= t && cross(hull[h - 1], hull[h], q[i]) <= 0) h --;
		hull[++ h] = q[i];
	}
	h --; //上凸壳最后把起点又加了一遍，去掉
	return h;
}

// 旋转卡壳：枚举每条边，用叉积比较对踵点到这条边的三角形面积，面积单峰所以 j 单调后移。
// j 在整轮里最多绕凸包一圈，总移动量 O(h)，每条边只做常数次距离比较。
ll rotating_calipers()
{
	if(h == 1) return 0; //全部点重合
	if(h == 2) return dist2(hull[1], hull[2]); //n=2 或全部共线，凸包退化成一条线段
	ll ans = 0;
	int j = 3;
	for(int i = 1; i <= h; i ++)
	{
		int ni = i % h + 1;
		while(cross(hull[i], hull[ni], hull[j % h + 1]) > cross(hull[i], hull[ni], hull[j]))
			j = j % h + 1;
		ans = max(ans, dist2(hull[i], hull[j]));
		ans = max(ans, dist2(hull[ni], hull[j]));
		int nj = j % h + 1; //面积平台有两个端点时，另一端也可能贡献直径
		ans = max(ans, dist2(hull[i], hull[nj]));
		ans = max(ans, dist2(hull[ni], hull[nj]));
	}
	return ans;
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：旋转卡壳（凸包直径） === */
const META = {
  title: '旋转卡壳：凸包直径',
  complexity: '凸包 O(n log n)（排序）　卡壳 O(h)（对踵点单调后移）',
  inputHint: '第一行 n，随后 n 行每行 x y（整数，n <= 9）',
  file: '旋转卡壳.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--info)', text: '原始点 / 当前边到对踵点的距离' },
    { color: 'var(--accent)', text: '当前枚举的凸包边 i→ni（粗线）' },
    { color: 'var(--warn)', text: '对踵点 j（叉积最大处）' },
    { color: 'var(--ok)', text: '当前最优直径 dist2（粗实线）' },
    { color: 'var(--border)', text: '凸包填充与网格' },
  ],
};
const MAX_N = 9;
const DEFAULT_INPUT = '9\n0 0\n4 0\n4 3\n0 3\n2 0\n2 2\n0 0\n4 3\n1 1';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入：第一行 n，随后 n 行坐标');
  const nums = text.trim().split(/\s+/).map(Number);
  if (nums.some((v) => !Number.isInteger(v))) throw new Error('坐标必须是整数');
  const n = nums[0];
  if (!(n >= 3 && n <= MAX_N)) throw new Error('点数 n 需在 3 到 ' + MAX_N + ' 之间');
  if (nums.length !== 1 + 2 * n) throw new Error('需要 ' + n + ' 组坐标（共 ' + 2 * n + ' 个整数）');
  const pts = [];
  for (let i = 0; i < n; i++) {
    const x = nums[1 + 2 * i], y = nums[2 + 2 * i];
    if (Math.abs(x) > 50 || Math.abs(y) > 50) throw new Error('坐标绝对值需 <= 50（演示规模）');
    pts.push({ x, y });
  }
  return { n, pts };
}

function randomInput() {
  const n = 6 + Math.floor(Math.random() * 4);
  const out = [String(n)];
  for (let i = 0; i < n; i++) out.push(Math.floor(Math.random() * 6) + ' ' + Math.floor(Math.random() * 6));
  return out.join('\n');
}

function cross(a, b, c) {
  return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
}
function d2(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}
function cp(p) {
  return { x: p.x, y: p.y };
}

function buildFrames({ n, pts }) {
  const frames = [];
  const p = pts.map(cp).sort((u, v) => (u.x !== v.x ? u.x - v.x : u.y - v.y));
  const q = [];
  const hull = [];
  let bestA = null, bestB = null;
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [14], phase: 'init', q: q.map(cp), hull: hull.map(cp), i: 0, j: 0,
    ni: 0, nj: 0, h: hull.length, ans: 0, bestA: bestA ? cp(bestA) : null, bestB: bestB ? cp(bestB) : null,
    crossNext: 0, crossCur: 0,
  }, f));

  snap({ note: '读入 ' + n + ' 个点，进入 convex_hull()：sort 按 (x, y) 排序', lines: [14] });
  snap({ note: '排序后 p = ' + p.map((o) => '(' + o.x + ',' + o.y + ')').join(' '), lines: [16], phase: 'sort' });

  for (let i = 1; i <= n; i++) {
    const pt = p[i - 1], last = q[q.length - 1];
    if (i === 1 || !(pt.x === last.x && pt.y === last.y)) q.push(cp(pt));
  }
  snap({ note: '去重后 m = ' + q.length + '：' + q.map((o) => '(' + o.x + ',' + o.y + ')').join(' '), lines: [18, 19], phase: 'dedupe' });

  if (q.length === 1) {
    hull.push(cp(q[0]));
    snap({ note: 'm == 1：hull[1] = q[1]，convex_hull 返回 1', lines: [20], h: 1, phase: 'hull' });
  } else {
    const m = q.length;
    for (let i = 1; i <= m; i++) {
      const pt = q[i - 1];
      snap({ note: '下凸壳：处理 q[' + i + '] = (' + pt.x + ',' + pt.y + ')，h = ' + hull.length, lines: [22], phase: 'lower', i, h: hull.length });
      while (hull.length >= 2) {
        const a = hull[hull.length - 2], b = hull[hull.length - 1];
        const cr = cross(a, b, pt);
        if (cr > 0) break;
        hull.pop();
        snap({ note: 'cross((' + a.x + ',' + a.y + '), (' + b.x + ',' + b.y + '), (' + pt.x + ',' + pt.y + ')) = ' + cr + ' <= 0，弹掉 (' + b.x + ',' + b.y + ')', lines: [24], phase: 'pop', i, h: hull.length });
      }
      hull.push(cp(pt));
      snap({ note: 'hull[++h] = (' + pt.x + ',' + pt.y + ')，h = ' + hull.length, lines: [25], phase: 'lower', i, h: hull.length });
    }
    const t = hull.length + 1;
    for (let i = m - 1; i >= 1; i--) {
      const pt = q[i - 1];
      snap({ note: '上凸壳：处理 q[' + i + '] = (' + pt.x + ',' + pt.y + ')，弹栈门槛 t = ' + t, lines: [27], phase: 'upper', i, h: hull.length });
      while (hull.length >= t) {
        const a = hull[hull.length - 2], b = hull[hull.length - 1];
        const cr = cross(a, b, pt);
        if (cr > 0) break;
        hull.pop();
        snap({ note: 'cross((' + a.x + ',' + a.y + '), (' + b.x + ',' + b.y + '), (' + pt.x + ',' + pt.y + ')) = ' + cr + ' <= 0 且 h >= t，弹栈', lines: [29], phase: 'pop', i, h: hull.length });
      }
      hull.push(cp(pt));
      snap({ note: 'hull[++h] = (' + pt.x + ',' + pt.y + ')，h = ' + hull.length, lines: [30], phase: 'upper', i, h: hull.length });
    }
    hull.pop();
    snap({ note: 'h-- 去掉重复加入的起点，h = ' + hull.length + '，凸包为 ' + hull.map((o) => '(' + o.x + ',' + o.y + ')').join(' '), lines: [32, 33], phase: 'hull', h: hull.length });
  }

  const H = [null].concat(hull.map(cp));
  const h = hull.length;
  let ans = 0;
  bestA = null; bestB = null;
  snap({ note: '进入 rotating_calipers()：凸包 h = ' + h, lines: [38], phase: 'calipers', h, ans });
  if (h === 1) {
    snap({ note: 'h == 1：所有点重合，返回 0', lines: [40], phase: 'done', h, ans: 0 });
    return frames;
  }
  if (h === 2) {
    ans = d2(hull[0], hull[1]);
    bestA = cp(hull[0]); bestB = cp(hull[1]);
    snap({ note: 'h == 2：凸包退化成线段，返回 dist2 = ' + ans, lines: [41], phase: 'done', h, ans, bestA, bestB });
    return frames;
  }

  snap({ note: 'ans = 0，对踵点从 j = 3 开始（1-based，绕凸包只前进不回退）', lines: [42, 43], phase: 'calipers', h, ans });
  let j = 3;
  for (let i = 1; i <= h; i++) {
    const ni = i % h + 1;
    snap({
      note: '枚举边 H[' + i + ']→H[' + ni + '] = (' + H[i].x + ',' + H[i].y + ')→(' + H[ni].x + ',' + H[ni].y + ')，当前 j = ' + j,
      lines: [44, 46], phase: 'edge', h, i, ni, j, ans,
    });
    while (true) {
      const nextJ = j % h + 1;
      const cn = cross(H[i], H[ni], H[nextJ]);
      const cc = cross(H[i], H[ni], H[j]);
      if (!(cn > cc)) break;
      snap({
        note: 'cross(H[i],H[ni],H[j%h+1]) = ' + cn + ' > cross(H[i],H[ni],H[j]) = ' + cc + '，j 后移到 ' + nextJ,
        lines: [47, 48], phase: 'advance', h, i, ni, j: nextJ, ans, crossNext: cn, crossCur: cc,
      });
      j = nextJ;
    }
    const nj = j % h + 1;
    const d1 = d2(H[i], H[j]), d2v = d2(H[ni], H[j]), d3 = d2(H[i], H[nj]), d4 = d2(H[ni], H[nj]);
    const cand = [
      { d: d1, a: H[i], b: H[j], tag: 'dist2(H[i], H[j])' },
      { d: d2v, a: H[ni], b: H[j], tag: 'dist2(H[ni], H[j])' },
      { d: d3, a: H[i], b: H[nj], tag: 'dist2(H[i], H[nj])' },
      { d: d4, a: H[ni], b: H[nj], tag: 'dist2(H[ni], H[nj])' },
    ];
    cand.forEach((o) => {
      if (o.d > ans) { ans = o.d; bestA = cp(o.a); bestB = cp(o.b); }
    });
    snap({
      note: 'j = ' + j + '，nj = ' + nj + '：四条候选 dist2 = ' + cand.map((o) => o.d).join(', ') + '，ans 更新为 ' + ans,
      lines: [49, 50, 51, 52, 53], phase: 'measure', h, i, ni, j, nj, ans,
      bestA: bestA ? cp(bestA) : null, bestB: bestB ? cp(bestB) : null,
      crossNext: cross(H[i], H[ni], H[nj]), crossCur: cross(H[i], H[ni], H[j]),
    });
  }
  snap({ note: '所有边枚举完，凸包直径的平方 = ' + ans + '，直径 = ' + Math.sqrt(ans).toFixed(3), lines: [55], phase: 'done', h, ans, bestA: bestA ? cp(bestA) : null, bestB: bestB ? cp(bestB) : null });
  return frames;
}

function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');
  const sub = document.createElement('div');
  sub.className = 'sub-line';
  sub.textContent = '点集 n = ' + data.pts.length + '　凸包 h = ' + frame.h + '　' +
    (frame.phase === 'calipers' || frame.phase === 'edge' || frame.phase === 'advance' || frame.phase === 'measure'
      ? '边 i→ni：' + frame.i + '→' + frame.ni + '　j = ' + frame.j + '　ans = ' + frame.ans
      : frame.phase === 'done' ? '直径平方 ans = ' + frame.ans : '构造凸包中');
  box.appendChild(sub);

  const W = 420, H = 300, PAD = 32;
  const xs = data.pts.map((o) => o.x), ys = data.pts.map((o) => o.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const sc = Math.min((W - 2 * PAD) / (x1 - x0), (H - 2 * PAD) / (y1 - y0));
  const ox = PAD + ((W - 2 * PAD) - (x1 - x0) * sc) / 2;
  const oy = PAD + ((H - 2 * PAD) - (y1 - y0) * sc) / 2;
  const X = (x) => ox + (x - x0) * sc;
  const Y = (y) => H - oy - (y - y0) * sc;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:460px" role="img">';
  svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--surface)" stroke="var(--border)"/>';
  for (let gx = Math.ceil(x0); gx <= Math.floor(x1); gx++) {
    if (x1 - x0 <= 20) svg += '<line x1="' + X(gx) + '" y1="' + Y(y0) + '" x2="' + X(gx) + '" y2="' + Y(y1) + '" stroke="var(--border)" stroke-dasharray="2 4"/>';
  }
  for (let gy = Math.ceil(y0); gy <= Math.floor(y1); gy++) {
    if (y1 - y0 <= 20) svg += '<line x1="' + X(x0) + '" y1="' + Y(gy) + '" x2="' + X(x1) + '" y2="' + Y(gy) + '" stroke="var(--border)" stroke-dasharray="2 4"/>';
  }

  if (frame.hull.length >= 3) {
    const pts = frame.hull.map((o) => X(o.x) + ',' + Y(o.y)).join(' ');
    svg += '<polygon points="' + pts + '" fill="var(--border)" fill-opacity="0.35" stroke="var(--info)" stroke-width="1.5"/>';
  }

  if (frame.phase === 'edge' || frame.phase === 'advance' || frame.phase === 'measure') {
    const i = frame.i, ni = frame.ni;
    const a = frame.hull[i - 1], b = frame.hull[ni - 1], jp = frame.hull[frame.j - 1];
    svg += '<line x1="' + X(a.x) + '" y1="' + Y(a.y) + '" x2="' + X(b.x) + '" y2="' + Y(b.y) + '" stroke="var(--accent)" stroke-width="4"/>';
    svg += '<line x1="' + X(a.x) + '" y1="' + Y(a.y) + '" x2="' + X(jp.x) + '" y2="' + Y(jp.y) + '" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    svg += '<line x1="' + X(b.x) + '" y1="' + Y(b.y) + '" x2="' + X(jp.x) + '" y2="' + Y(jp.y) + '" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    svg += '<circle cx="' + X(jp.x) + '" cy="' + Y(jp.y) + '" r="7" fill="var(--warn)" stroke="var(--surface)" stroke-width="2"/>';
    svg += '<text x="' + (X(jp.x) + 9) + '" y="' + (Y(jp.y) - 9) + '" font-size="11" fill="var(--warn)">j=' + frame.j + '</text>';
  }

  if (frame.bestA && frame.bestB) {
    svg += '<line x1="' + X(frame.bestA.x) + '" y1="' + Y(frame.bestA.y) + '" x2="' + X(frame.bestB.x) + '" y2="' + Y(frame.bestB.y) +
      '" stroke="var(--ok)" stroke-width="3"/>';
  }

  frame.hull.forEach((o, k) => {
    svg += '<circle cx="' + X(o.x) + '" cy="' + Y(o.y) + '" r="4" fill="var(--info)"/>';
    svg += '<text x="' + (X(o.x) + 7) + '" y="' + (Y(o.y) - 7) + '" font-size="10" fill="var(--faint)">H' + (k + 1) + '</text>';
  });
  data.pts.forEach((o) => {
    svg += '<circle cx="' + X(o.x) + '" cy="' + Y(o.y) + '" r="2" fill="var(--faint)"/>';
  });
  svg += '</svg>';
  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  box.appendChild(wrap);

  if (frame.hull.length) {
    const prow = document.createElement('div');
    prow.className = 'plist';
    frame.hull.forEach((o, k) => {
      const c = document.createElement('span');
      c.className = 'pchip' + (frame.phase === 'edge' || frame.phase === 'advance' || frame.phase === 'measure' ? (k + 1 === frame.i ? ' on' : '') : '');
      c.textContent = 'H' + (k + 1) + '(' + o.x + ',' + o.y + ')';
      prow.appendChild(c);
    });
    box.appendChild(prow);
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'measure') {
    eq.textContent = 'ans = ' + frame.ans + '（凸包直径的平方；当前边 i=' + frame.i + '，对踵点 j=' + frame.j + '，nj=' + frame.nj + '）';
  } else if (frame.phase === 'advance') {
    eq.textContent = '叉积比较：next = ' + frame.crossNext + ' > cur = ' + frame.crossCur + '，j 继续后移';
  } else if (frame.phase === 'done') {
    eq.textContent = '最终 ans = ' + frame.ans + '　直径 = ' + Math.sqrt(frame.ans).toFixed(3);
  } else {
    eq.textContent = '面积关于边单峰，所以对踵点 j 只会沿凸包单调前进，总移动 O(h)。';
  }
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
