<script type="text/plain" id="code-src">
void get_info(int rt)
{
	ocnt = 0;
	queue<int> q; q.push(rt); par[rt] = 0;
	while(!q.empty())
	{
		int u = q.front(); q.pop();
		order[++ ocnt] = u;
		for(Edge e : g[u]) if(e.v != par[u] && !del[e.v])
		{
			par[e.v] = u;
			q.push(e.v);
		}
	}
	for(int i = 1; i <= ocnt; i ++) sz[order[i]] = 1, msz[order[i]] = 0;
	for(int i = ocnt; i >= 2; i --)
	{
		int u = order[i];
		sz[par[u]] += sz[u];
		if(sz[u] > msz[par[u]]) msz[par[u]] = sz[u];
	}
}

// 找重心：删掉它之后最大连通块最小；total - sz[u] 是 u 头顶那一块
int get_centroid(int rt) //要先调用 get_info(rt) 把 sz 算好
{
	int total = sz[rt], best = inf, root = rt;
	for(int i = 1; i <= ocnt; i ++)
	{
		int u = order[i];
		int mx = max(msz[u], total - sz[u]);
		if(mx < best) best = mx, root = u;
	}
	return root;
}

// 收集 st 所在子树里每个点到重心的距离（手写栈，链状块递归会爆栈）
void collect_dist(int st, int from, int d0, vector<int> &vec)
{
	stack<pair<int, pair<int, int> > > stk; //(节点, (父亲, 到重心的距离))
	stk.push(make_pair(st, make_pair(from, d0)));
	while(!stk.empty())
	{
		int u = stk.top().first, p = stk.top().second.first, d = stk.top().second.second;
		stk.pop();
		if(d > k) continue; //边权为正，再往下只会更大；k 比所有路径都大时相当于不剪枝
		vec.push_back(d);
		for(Edge e : g[u]) if(e.v != p && !del[e.v]) stk.push(make_pair(e.v, make_pair(u, d + e.w)));
	} //距离用 int 存，边权能到 1e9 的时候要换 ll
}

// 双指针统计有序数组里 v[i] + v[j] == k 的无序对 (i < j) 个数
// 同一个 i 不会和自己配对，所以 u = u 永远不会被算进去
ll count_pairs_k(vector<int> &v)
{
	ll res = 0;
	int i = 0, j = (int)v.size() - 1;
	while(i < j)
	{
		ll s = (ll)v[i] + v[j];
		if(s == k)
		{
			if(v[i] == v[j]) { ll c = j - i + 1; res += c * (c - 1) / 2; break; } //中间全是同一个值，直接组合数
			ll ci = 1, cj = 1;
			while(i + 1 < j && v[i + 1] == v[i]) i ++, ci ++;
			while(j - 1 > i && v[j - 1] == v[j]) j --, cj ++;
			res += ci * cj; i ++; j --;
		}
		else if(s < k) i ++;
		else j --;
	}
	return res;
}

// 统计经过重心的路径：先把每个子树到重心的距离收集起来（只收集 ≤ k 的）
// 先加"所有点一起配对"的数量，再减去"同一子树内部配对"的数量——后者两点路径不过重心，留给下层递归算，
// 这样每个无序点对恰好被它的 LCA 那一层的重心统计一次，(u,v) 和 (v,u)、u = u 都不会重复
void calc(int root)
{
	vector<int> all;
	all.push_back(0); //重心自身距离为 0，单端点就是重心的路径靠它配上
	for(Edge e : g[root]) if(!del[e.v])
	{
		vector<int> sub;
		collect_dist(e.v, root, e.w, sub);
		sort(sub.begin(), sub.end());
		ans -= count_pairs_k(sub);
		all.insert(all.end(), sub.begin(), sub.end());
	}
	sort(all.begin(), all.end()); //整体只排一次：每个子树单独排会退化成 O(n² log n)（菊花图实测很慢）
	ans += count_pairs_k(all);
}

// 点分治主过程：重心分解的递归深度本身只有 O(log n)，但收集/求大小的递归深度是块大小，
// 所以这里全部改成手写栈 + BFS 定序的写法
void decompose(int rt)
{
	vector<int> stk; stk.push_back(rt);
	while(!stk.empty())
	{
		int u = stk.back(); stk.pop_back();
		get_info(u);
		int root = get_centroid(u);
		calc(root); //先统计经过 root 的路径，再删掉 root
		del[root] = true;
		for(Edge e : g[root]) if(!del[e.v]) stk.push_back(e.v);
	}
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：点分治（统计距离为 k 的点对） === */
const META = {
  title: '点分治（距离为 k 的点对）',
  complexity: 'O(n log n)（每层重心 + 双指针配对）',
  inputHint: '第一行 n k；随后 n-1 行 u v w（边权为正整数）',
  file: '点分治.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前重心 root（粗实线）' },
    { color: 'var(--info)', text: '当前连通块里的节点' },
    { color: 'var(--warn)', text: '正在收集距离的子树（粗虚线）' },
    { color: 'var(--bad)', text: '已经删除的重心（虚线 + ×）' },
    { color: 'var(--ok)', text: '本次配对符合条件的距离' },
  ],
};
const MAX_N = 9;
const DEFAULT_INPUT = '5 3\n1 2 1\n2 3 1\n3 4 1\n3 5 1';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入 n k 与边');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  const h = lines[0].trim().split(/\s+/).map(Number);
  if (h.length !== 2 || h.some((x) => !Number.isInteger(x))) throw new Error('第一行需要两个整数 n k');
  const [n, k] = h;
  if (n < 2 || n > MAX_N) throw new Error('n 需在 2 到 ' + MAX_N + ' 之间（演示规模）');
  if (k < 1 || k > 30) throw new Error('k 需在 1 到 30 之间');
  if (lines.length !== n) throw new Error('需要 ' + (n - 1) + ' 行边');
  const edges = [];
  for (let i = 1; i < n; i++) {
    const p = lines[i].trim().split(/\s+/).map(Number);
    if (p.length !== 3 || p.some((x) => !Number.isInteger(x))) throw new Error('每行需要 u v w 三个整数');
    if (p[0] < 1 || p[0] > n || p[1] < 1 || p[1] > n || p[0] === p[1]) throw new Error('边端点需在 1..n 且不能自环');
    if (p[2] < 1) throw new Error('边权需为正整数');
    edges.push({ u: p[0], v: p[1], w: p[2] });
  }
  return { n, k, edges };
}

function randomInput() {
  const n = 5 + Math.floor(Math.random() * 5);
  const k = 2 + Math.floor(Math.random() * 5);
  const edges = [];
  for (let i = 2; i <= n; i++) edges.push((1 + Math.floor(Math.random() * (i - 1))) + ' ' + i + ' ' + (1 + Math.floor(Math.random() * 3)));
  return n + ' ' + k + '\n' + edges.join('\n');
}

function buildFrames({ n, k, edges }) {
  const g = Array.from({ length: n + 1 }, () => []);
  for (const e of edges) { g[e.u].push({ v: e.v, w: e.w }); g[e.v].push({ v: e.u, w: e.w }); }
  const del = new Array(n + 1).fill(false);
  const par = new Array(n + 1).fill(0), sz = new Array(n + 1).fill(0), msz = new Array(n + 1).fill(0);
  let ans = 0;
  const frames = [];
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], del: del.slice(), par: par.slice(), sz: sz.slice(), msz: msz.slice(),
    comp: [], root: 0, sub: [], all: [], vec: [], ans, phase: 'init',
  }, f));

  snap({ note: '点分治从 1 开始：del 全 false，ans = 0，k = ' + k, lines: [96, 98, 102] });

  let ocnt = 0;
  const order = new Array(n + 2).fill(0);
  const info = (rt) => {
    ocnt = 0;
    const q = [rt];
    par[rt] = 0;
    while (q.length) {
      const u = q.shift();
      order[++ocnt] = u;
      for (const e of g[u]) if (e.v !== par[u] && !del[e.v]) { par[e.v] = u; q.push(e.v); }
    }
    for (let i = 1; i <= ocnt; i++) { sz[order[i]] = 1; msz[order[i]] = 0; }
    for (let i = ocnt; i >= 2; i--) {
      const u = order[i];
      sz[par[u]] += sz[u];
      if (sz[u] > msz[par[u]]) msz[par[u]] = sz[u];
    }
    return order.slice(1, ocnt + 1);
  };

  const dist = (st, from, d0) => {
    const res = [];
    const stk = [[st, from, d0]];
    while (stk.length) {
      const [u, p, d] = stk.pop();
      if (d > k) continue;
      res.push(d);
      for (const e of g[u]) if (e.v !== p && !del[e.v]) stk.push([e.v, u, d + e.w]);
    }
    return res;
  };

  const pairs = (v) => {
    let res = 0;
    let i = 0, j = v.length - 1;
    while (i < j) {
      const s = v[i] + v[j];
      if (s === k) {
        if (v[i] === v[j]) { const c = j - i + 1; res += (c * (c - 1)) / 2; break; }
        let ci = 1, cj = 1;
        while (i + 1 < j && v[i + 1] === v[i]) { i++; ci++; }
        while (j - 1 > i && v[j - 1] === v[j]) { j--; cj++; }
        res += ci * cj; i++; j--;
      } else if (s < k) i++;
      else j--;
    }
    return res;
  };

  const stack = [1];
  while (stack.length) {
    const u0 = stack.pop();
    snap({ note: 'decompose 弹出一个待处理块，起点 u = ' + u0, lines: [96, 98, 101], root: u0, phase: 'pop' });
    const comp = info(u0);
    snap({ note: 'get_info(' + u0 + ')：块内 ' + comp.length + ' 个点，BFS 序 = [' + comp.join(', ') + ']，逆序回代出 sz/msz', lines: [1, 3, 4, 15, 16, 18, 19, 20], comp, phase: 'info' });
    const total = sz[u0];
    let best = Infinity, root = u0;
    for (const x of comp) {
      const mx = Math.max(msz[x], total - sz[x]);
      if (mx < best) { best = mx; root = x; }
    }
    snap({ note: 'get_centroid：删掉每个点后最大连通块 = max(msz[u], total - sz[u])，取最小的 → root = ' + root + '（最大块 ' + best + '）', lines: [25, 27, 28, 30, 31, 32, 34], comp, root, phase: 'centroid' });

    const all = [0];
    snap({ note: 'calc(' + root + ')：all 先放重心自己的距离 0，然后逐个儿子子树收集距离', lines: [78, 80, 81, 82], comp, root, all: all.slice(), phase: 'calc' });
    for (const e of g[root]) if (!del[e.v]) {
      const sub = dist(e.v, root, e.w).sort((a, b) => a - b);
      const subPairs = pairs(sub);
      ans -= subPairs;
      snap({ note: '子树 ' + e.v + ' 到重心的距离 sub = [' + sub.join(', ') + ']，同子树内部配对 ' + subPairs + ' 对要减掉（这些路径不经过重心）', lines: [83, 85, 86, 87, 88], comp, root, sub: [e.v], vec: sub.slice(), all: all.slice(), phase: 'sub' });
      for (const d of sub) all.push(d);
      all.sort((a, b) => a - b);
    }
    const addPairs = pairs(all);
    ans += addPairs;
    snap({ note: 'sort(all) 后 all = [' + all.join(', ') + ']，双指针数出 ' + addPairs + ' 对，ans = ' + ans, lines: [90, 91, 92], comp, root, vec: all.slice(), all: all.slice(), phase: 'add' });
    del[root] = true;
    snap({ note: 'del[' + root + '] = true，把重心删掉；它的每个未删除邻接点各自成为一个新块', lines: [104, 105, 106], comp, root, phase: 'del' });
    for (const e of g[root]) if (!del[e.v]) stack.push(e.v);
  }
  snap({ note: '全部分治完成：距离为 ' + k + ' 的点对共 ' + ans + ' 个', lines: [108], phase: 'done' });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');
  const n = data.n;
  const g = Array.from({ length: n + 1 }, () => []);
  for (const e of data.edges) { g[e.u].push(e.v); g[e.v].push(e.u); }
  const children = Array.from({ length: n + 1 }, () => []);
  (function build(u, p) {
    for (const v of g[u]) if (v !== p) { children[u].push(v); build(v, u); }
  })(1, 0);
  const pos = {};
  let leaf = 0;
  const dx = 56, dy = 62;
  (function dfs(u, d) {
    if (!children[u].length) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    children[u].forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[children[u][0]].x + pos[children[u][children[u].length - 1]].x) / 2, y: d * dy };
  })(1, 0);

  let s = '<svg width="100%" height="' + (Math.max(...Object.values(pos).map((p) => p.y)) + 84) + '" viewBox="' + svgBox(Object.values(pos), 42) + '" role="img" aria-label="点分治">';
  for (let i = 2; i <= n; i++) {
    const p = frame.par[i] && !frame.del[i] ? frame.par[i] : 1;
    s += edgeSvg(pos[p], pos[i], { r: 20, dash: frame.del[i] ? '4 3' : '' });
  }
  for (let i = 1; i <= n; i++) {
    let stroke = 'var(--border)', width = 1.5;
    if (frame.comp.includes(i)) { stroke = 'var(--info)'; width = 2; }
    if (frame.sub.includes(frame.par[i])) { stroke = 'var(--warn)'; width = 2.5; }
    if (i === frame.root) { stroke = 'var(--accent)'; width = 3; }
    if (frame.del[i]) { stroke = 'var(--bad)'; width = 1.5; }
    const p = pos[i];
    s += '<rect x="' + (p.x - 21) + '" y="' + (p.y - 19) + '" width="42" height="38" rx="8" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '"' + (frame.del[i] ? ' stroke-dasharray="4 3"' : '') + '/>';
    s += textSvg(p.x, p.y - 1, String(i), { size: 13, weight: 700, fill: frame.del[i] ? 'var(--faint)' : 'var(--text)' });
    s += textSvg(p.x, p.y + 12, frame.del[i] ? '×' : 'sz' + frame.sz[i], { size: 9, fill: frame.del[i] ? 'var(--bad)' : 'var(--faint)' });
  }
  s += '</svg>';
  const wrap = document.createElement('div');
  wrap.innerHTML = s;
  box.appendChild(wrap);

  const vrow = document.createElement('div');
  vrow.className = 'plist';
  const vl = document.createElement('span');
  vl.className = 'sub-line';
  vl.style.cssText = 'margin:0 6px 0 0';
  vl.textContent = frame.phase === 'sub' ? '本子树距离' : 'all（排序后）';
  vrow.appendChild(vl);
  (frame.vec.length ? frame.vec : frame.all).forEach((d) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (d === 0 ? '' : ' on');
    c.textContent = String(d);
    vrow.appendChild(c);
  });
  if (!frame.vec.length && !frame.all.length) {
    const e = document.createElement('span');
    e.className = 'pchip';
    e.textContent = '空';
    vrow.appendChild(e);
  }
  box.appendChild(vrow);

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  eq.textContent = '当前 ans = ' + frame.ans + (frame.root ? '　重心 ' + frame.root : '') + '　k = ' + data.k;
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
