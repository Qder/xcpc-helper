<style>

<script type="text/plain" id="code-src">
void add(int pos) //把位置 pos 加进当前区间
{
	if(++ cnt[a[pos]] == 1) distinct ++; //这个值第一次出现才算多了一个不同数
}

void del(int pos)
{
	if(-- cnt[a[pos]] == 0) distinct --;
}

int main()
{
	ios::sync_with_stdio(false);
	cin.tie(0); cout.tie(0);
	
	cin >> n >> m;
	for(int i = 1; i <= n; i ++)
	{
		cin >> a[i];
		val[i] = a[i];
	}
	//值域可能很大或带负数，先离散化成 0 ~ tot-1 再用 cnt 计数
	sort(val + 1, val + n + 1);
	int tot = (int)(unique(val + 1, val + n + 1) - val - 1);
	for(int i = 1; i <= n; i ++) a[i] = (int)(lower_bound(val + 1, val + tot + 1, a[i]) - val) - 1;
	
	//本文件块长取 n / sqrt(m)：左指针每个询问最多走 O(block)，共 O(m * block)；
	//右指针在每个左块内单调（奇偶排序）走 O(n)，共 O(n * n / block)；
	//两边平衡得 block = n / sqrt(m)，总复杂度 O(n * sqrt(m))，n、m 同阶时即 O((n + m) * sqrt(n))
	//（m = 0 时 sqrt(0) 会除零，所以用 max(1.0, ...) 兜底；m 很小的时候 block 会顶到 n，也是对的）
	block = max(1, (int)(n / max(1.0, sqrt((double)m))));
	for(int i = 1; i <= m; i ++)
	{
		cin >> q[i].l >> q[i].r;
		q[i].id = i; //离线排序会打乱顺序，答案要按原编号存回去
	}
	//奇偶排序（蛇形）：左端点块升序；同一块内奇数块右端点升序、偶数块降序，
	//这样右指针扫完一块后从右边接着扫回来，少走回头路
	sort(q + 1, q + m + 1, [](const Query &x, const Query &y)
	{
		int bx = (x.l - 1) / block, by = (y.l - 1) / block;
		if(bx != by) return bx < by;
		return (bx & 1) ? x.r > y.r : x.r < y.r;
	});
	
	int curL = 1, curR = 0; //空区间写成 [1, 0]
	for(int i = 1; i <= m; i ++)
	{
		int l = q[i].l, r = q[i].r;
		while(curL > l) add(-- curL); //先扩后缩：先加不会让区间变空
		while(curR < r) add(++ curR);
		while(curL < l) del(curL ++);
		while(curR > r) del(curR --);
		ans[q[i].id] = distinct;
	}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：莫队（区间不同数个数） === */
const META = {
  title: '莫队（区间不同数个数）',
  complexity: 'O((n + m)·sqrt(n))（块长 n / sqrt(m)，奇偶排序）',
  inputHint: '第一行 n m；第二行 n 个数；随后 m 行询问 l r',
  file: '莫队.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前维护的区间 [curL, curR]' },
    { color: 'var(--info)', text: '本次询问的目标区间 [l, r]' },
    { color: 'var(--warn)', text: '本步 add / del 的位置' },
    { color: 'var(--ok)', text: '当前答案 distinct' },
    { color: 'var(--border)', text: '区间外的位置' },
  ],
};
const MAX_N = 10;
const MAX_M = 5;
const DEFAULT_INPUT = '5 3\n1 1 2 1 3\n1 3\n2 5\n1 5';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入 n m、数组和询问');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  if (lines.length < 2) throw new Error('需要两行：n m 和数组');
  const h = lines[0].trim().split(/\s+/).map(Number);
  if (h.length !== 2 || h.some((x) => !Number.isInteger(x))) throw new Error('第一行需要两个整数 n m');
  const [n, m] = h;
  if (n < 1 || n > MAX_N) throw new Error('n 需在 1 到 ' + MAX_N + ' 之间（演示规模）');
  if (m < 1 || m > MAX_M) throw new Error('询问数 m 需在 1 到 ' + MAX_M + ' 之间');
  if (lines.length !== m + 2) throw new Error('需要 1 行数组 + ' + m + ' 行询问');
  const arr = lines[1].trim().split(/\s+/).map(Number);
  if (arr.length !== n || arr.some((x) => !Number.isInteger(x))) throw new Error('第二行需要正好 ' + n + ' 个整数');
  const qs = [];
  for (let i = 0; i < m; i++) {
    const p = lines[i + 2].trim().split(/\s+/).map(Number);
    if (p.length !== 2 || p.some((x) => !Number.isInteger(x))) throw new Error('每个询问需要两个整数 l r');
    if (p[0] < 1 || p[1] > n || p[0] > p[1]) throw new Error('询问需满足 1 <= l <= r <= ' + n);
    qs.push({ l: p[0], r: p[1], id: i + 1 });
  }
  return { arr: [0, ...arr], n, m, qs };
}

function randomInput() {
  const n = 7 + Math.floor(Math.random() * 4);
  const m = 3 + Math.floor(Math.random() * 3);
  const rows = [n + ' ' + m, Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 4)).join(' ')];
  for (let i = 0; i < m; i++) {
    const l = 1 + Math.floor(Math.random() * n);
    const r = l + Math.floor(Math.random() * (n - l + 1));
    rows.push(l + ' ' + r);
  }
  return rows.join('\n');
}

function buildFrames({ arr, n, m, qs }) {
  const raw = arr.slice();
  const sortedVals = [...new Set(raw.slice(1))].sort((x, y) => x - y);
  const a = raw.map((v) => (v === 0 ? 0 : sortedVals.indexOf(v)));
  const cnt = new Array(sortedVals.length).fill(0);
  let distinct = 0;
  const block = Math.max(1, Math.floor(n / Math.max(1, Math.sqrt(m))));
  const queries = qs.map((q) => Object.assign({}, q));
  queries.sort((x, y) => {
    const bx = Math.floor((x.l - 1) / block), by = Math.floor((y.l - 1) / block);
    if (bx !== by) return bx - by;
    return (bx & 1) ? y.r - x.r : x.r - y.r;
  });
  const frames = [];
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], a: a.slice(), cnt: cnt.slice(), curL: 1, curR: 0, distinct,
    cur: 0, target: null, sortIdx: -1, answer: null, order: queries.map((q) => q.id), phase: 'init',
  }, f));

  snap({ note: '离散化后 a = [' + a.slice(1).join(', ') + ']；空区间写成 [curL, curR] = [1, 0]，distinct = 0', lines: [1, 11, 16, 17, 18, 19, 22, 23, 24, 25] });
  snap({ note: '块长 block = n / sqrt(m) = ' + block + '；奇偶排序后的询问顺序：' + queries.map((q) => '#' + q.id + '[' + q.l + ',' + q.r + ']').join(' → '), lines: [31, 39, 41, 43, 45, 46] });

  let curL = 1, curR = 0;
  for (let i = 0; i < queries.length; i++) {
    const { l, r, id } = queries[i];
    snap({ note: '处理询问 #' + id + '：目标 [' + l + ', ' + r + ']，当前 [' + curL + ', ' + curR + ']', lines: [46, 47, 49], curL, curR, target: [l, r], sortIdx: i, phase: 'query' });
    while (curL > l) {
      curL--;
      if (++cnt[a[curL]] === 1) distinct++;
      snap({ note: 'curL > l：add(--curL)，把位置 ' + curL + '（值 ' + raw[curL] + '）加进来，cnt = ' + cnt[a[curL]] + '，distinct = ' + distinct, lines: [50], curL, curR, cur: curL, target: [l, r], sortIdx: i, phase: 'add' });
    }
    while (curR < r) {
      curR++;
      if (++cnt[a[curR]] === 1) distinct++;
      snap({ note: 'curR < r：add(++curR)，把位置 ' + curR + '（值 ' + raw[curR] + '）加进来，cnt = ' + cnt[a[curR]] + '，distinct = ' + distinct, lines: [51], curL, curR, cur: curR, target: [l, r], sortIdx: i, phase: 'add' });
    }
    while (curL < l) {
      if (--cnt[a[curL]] === 0) distinct--;
      snap({ note: 'curL < l：del(curL++)，位置 ' + curL + ' 移出，cnt = ' + cnt[a[curL]] + '，distinct = ' + distinct, lines: [52], curL, curR, cur: curL, target: [l, r], sortIdx: i, phase: 'del' });
      curL++;
    }
    while (curR > r) {
      if (--cnt[a[curR]] === 0) distinct--;
      snap({ note: 'curR > r：del(curR--)，位置 ' + curR + ' 移出，cnt = ' + cnt[a[curR]] + '，distinct = ' + distinct, lines: [53], curL, curR, cur: curR, target: [l, r], sortIdx: i, phase: 'del' });
      curR--;
    }
    snap({ note: '区间 [' + l + ', ' + r + '] 的不同数个数 = ' + distinct + '，存进 ans[' + id + ']', lines: [54], curL, curR, target: [l, r], sortIdx: i, answer: distinct, phase: 'answer' });
  }
  snap({ note: '按原编号输出答案：' + queries.map((q) => 'ans[' + q.id + ']').join('、') + '（顺序与输入一致）', lines: [55], curL, curR, phase: 'done' });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');

  const qrow = document.createElement('div');
  qrow.className = 'plist';
  data.qs.forEach((q) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (frame.target && frame.target[0] === q.l && frame.target[1] === q.r ? ' on' : '');
    c.textContent = '#' + q.id + ' [' + q.l + ',' + q.r + ']';
    qrow.appendChild(c);
  });
  box.appendChild(qrow);

  const strip = document.createElement('div');
  strip.className = 'strip';
  for (let i = 1; i <= data.n; i++) {
    const c = document.createElement('div');
    c.className = 'b';
    const inCur = i >= frame.curL && i <= frame.curR;
    let bd = '1px solid var(--border)';
    if (frame.target && i >= frame.target[0] && i <= frame.target[1]) bd = '2px dashed var(--info)';
    if (inCur) bd = '2px solid var(--accent)';
    if (i === frame.cur) bd = '2px solid var(--warn)';
    c.style.border = bd;
    c.style.color = inCur ? 'var(--text)' : 'var(--faint)';
    c.textContent = data.arr[i] + '\n' + i;
    c.style.whiteSpace = 'pre-line';
    c.style.font = '700 12px/1.35 ui-monospace, Consolas, monospace';
    strip.appendChild(c);
  }
  box.appendChild(strip);

  const crow = document.createElement('div');
  crow.className = 'plist';
  const lab = document.createElement('span');
  lab.className = 'sub-line';
  lab.style.cssText = 'margin:0 6px 0 0';
  lab.textContent = 'cnt（离散化后的值 → 出现次数）';
  crow.appendChild(lab);
  frame.cnt.forEach((v, idx) => {
    if (v === 0) return;
    const c = document.createElement('span');
    c.className = 'pchip' + (v > 0 ? ' on' : '');
    c.textContent = idx + '×' + v;
    crow.appendChild(c);
  });
  if (!frame.cnt.some((v) => v > 0)) {
    const e = document.createElement('span');
    e.className = 'pchip';
    e.textContent = '空';
    crow.appendChild(e);
  }
  box.appendChild(crow);

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  eq.textContent = 'curL = ' + frame.curL + '，curR = ' + frame.curR + '，distinct = ' + frame.distinct +
    (frame.answer !== null ? '（本问答案 ' + frame.answer + '）' : '') +
    (frame.target ? '，目标 [' + frame.target[0] + ', ' + frame.target[1] + ']' : '');
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
