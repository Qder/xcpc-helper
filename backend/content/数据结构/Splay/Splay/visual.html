<script type="text/plain" id="code-src">
void rpush_up(int u)
{
	rsz[u] = rsz[rch[u][0]] + rsz[rch[u][1]] + 1; //每个节点代表一个位置，不记 cnt
}

void rpush_down(int u)
{
	if(!rrev[u]) return;
	swap(rch[u][0], rch[u][1]); //翻转 = 交换左右儿子 + 给儿子打标记
	if(rch[u][0]) rrev[rch[u][0]] ^= 1;
	if(rch[u][1]) rrev[rch[u][1]] ^= 1;
	rrev[u] = false;
}

void rrotate(int u)
{
	int f = rfa[u], g = rfa[f], d = (rch[f][1] == u);
	rch[f][d] = rch[u][d ^ 1];
	if(rch[u][d ^ 1]) rfa[rch[u][d ^ 1]] = f;
	rfa[u] = g;
	if(g) rch[g][rch[g][1] == f] = u;
	rch[u][d ^ 1] = f; rfa[f] = u;
	rpush_up(f); rpush_up(u);
}

void rsplay(int u, int goal = 0)
{
	int top = 0, t = u;
	rstk[++ top] = t;
	while(rfa[t] != goal) t = rfa[t], rstk[++ top] = t;
	while(top) rpush_down(rstk[top --]); //从上到下推标记，保证旋转时左右儿子的含义是对的
	while(rfa[u] != goal)
	{
		int f = rfa[u], g = rfa[f];
		if(g != goal)
		{
			int du = (rch[f][1] == u), dg = (rch[g][1] == f);
			rrotate(du == dg ? f : u);
		}
		rrotate(u);
	}
	if(!goal) rroot = u;
}

int rkth(int k) //第 k 个位置（1-based），返回节点编号
{
	int u = rroot;
	while(u)
	{
		rpush_down(u);
		int l = rch[u][0];
		if(k <= rsz[l]) u = l;
		else if(k == rsz[l] + 1) { rsplay(u); return u; }
		else { k -= rsz[l] + 1; u = rch[u][1]; }
	}
	return 0;
}

int rbuild(int l, int r, int f) //按位置递归建树，中序遍历就是原序列
{
	if(l > r) return 0;
	int mid = (l + r) >> 1;
	int u = ++ rtot;
	rval[u] = mid; rfa[u] = f; rrev[u] = false;
	rch[u][0] = rbuild(l, mid - 1, u);
	rch[u][1] = rbuild(mid + 1, r, u);
	rpush_up(u);
	return u;
}

void build_seq(int len) //建 0..len+1 的哨兵序列，之后翻转 [1, len] 不越界
{
	rtot = 0; rlen = len;
	rroot = rbuild(0, len + 1, 0);
}

void reverse_range(int l, int r) //翻转区间 [l, r]（1-based）
{
	int L = rkth(l); //第 l 个节点就是位置 l-1（哨兵也算一个）
	int R = rkth(r + 2); //第 r+2 个节点就是位置 r+1
	rsplay(L, 0);
	rsplay(R, L); //L 在根，R 是根的右儿子
	int t = rch[R][0];
	if(t) rrev[t] ^= 1; //整段打标记，具体交换留到下次访问
}

void print_seq(int u)
{
	if(!u) return;
	rpush_down(u); //输出前下传，保证中序是真实顺序
	print_seq(rch[u][0]);
	if(rval[u] >= 1 && rval[u] <= rlen) cout << rval[u] << ' ';
	print_seq(rch[u][1]);
}
</script>

  function layoutCircle(n, cx, cy, r) {

}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：文艺平衡树（区间翻转） === */
const META = {
  title: '文艺平衡树（Splay 区间翻转）',
  complexity: '建树 O(n)　每次翻转均摊 O(log n)',
  inputHint: '第一行序列长度 len；第二行翻转次数 m；随后 m 行 l r',
  file: 'Splay.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '正在旋转 / 正在访问的节点（粗实线）' },
    { color: 'var(--warn)', text: '打了 rev 标记的子树（虚线 + ⇄）' },
    { color: 'var(--info)', text: 'rsplay 前从根到 u 的路径（自上而下 push_down）' },
    { color: 'var(--ok)', text: '翻转区间对应的子树根 t' },
    { color: 'var(--border)', text: '其它节点 / 两个哨兵' },
  ],
};
const MAX_LEN = 9;
const MAX_OPS = 4;
const MAX_N = MAX_LEN;
const DEFAULT_INPUT = '7\n2\n1 7\n3 5';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入序列长度与翻转操作');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  if (lines.length < 2) throw new Error('需要两行：序列长度 len 和翻转次数 m');
  const len = Number(lines[0].trim());
  const m = Number(lines[1].trim());
  if (!Number.isInteger(len) || len < 1 || len > MAX_LEN) throw new Error('序列长度需在 1 到 ' + MAX_LEN + ' 之间（演示规模）');
  if (!Number.isInteger(m) || m < 1 || m > MAX_OPS) throw new Error('翻转次数需在 1 到 ' + MAX_OPS + ' 之间');
  if (lines.length !== m + 2) throw new Error('翻转次数是 ' + m + '，后面必须正好有 ' + m + ' 行 l r');
  const ops = [];
  for (let i = 0; i < m; i++) {
    const p = lines[i + 2].trim().split(/\s+/).map(Number);
    if (p.length !== 2 || p.some((x) => !Number.isInteger(x))) throw new Error('第 ' + (i + 1) + ' 个翻转需要两个整数 l r');
    const [l, r] = p;
    if (l < 1 || r > len || l > r) throw new Error('翻转区间需满足 1 <= l <= r <= ' + len);
    ops.push([l, r]);
  }
  return { len, ops };
}

function randomInput() {
  const len = 4 + Math.floor(Math.random() * 5);
  const m = 1 + Math.floor(Math.random() * 3);
  const rows = [];
  for (let i = 0; i < m; i++) {
    const l = 1 + Math.floor(Math.random() * len);
    const r = l + Math.floor(Math.random() * (len - l + 1));
    rows.push(l + ' ' + r);
  }
  return len + '\n' + m + '\n' + rows.join('\n');
}

function buildFrames({ len, ops }) {
  const rch0 = [0], rch1 = [0], rfa = [0], rval = [0], rsz = [0], rrev = [0];
  let rroot = 0, rtot = 0, curOp = -1;
  const frames = [];
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], ch0: rch0.slice(), ch1: rch1.slice(), fa: rfa.slice(), val: rval.slice(),
    sz: rsz.slice(), rev: rrev.slice(), root: rroot, cur: 0, t: 0, path: [], seq: logical(),
    phase: 'init', opIndex: -1,
  }, f));

  function logical() {
    const out = [];
    (function go(u, flip) {
      if (!u) return;
      const f = flip ^ (rrev[u] ? 1 : 0);
      if (f) {
        go(rch1[u], f);
        if (rval[u] >= 1 && rval[u] <= len) out.push(rval[u]);
        go(rch0[u], f);
      } else {
        go(rch0[u], f);
        if (rval[u] >= 1 && rval[u] <= len) out.push(rval[u]);
        go(rch1[u], f);
      }
    })(rroot, 0);
    return out;
  }

  const rpush_up = (u) => { rsz[u] = rsz[rch0[u]] + rsz[rch1[u]] + 1; };
  const rpush_down = (u) => {
    if (!rrev[u]) return false;
    const a = rch0[u], b = rch1[u];
    rch0[u] = b; rch1[u] = a;
    if (rch0[u]) rrev[rch0[u]] = rrev[rch0[u]] ? 0 : 1;
    if (rch1[u]) rrev[rch1[u]] = rrev[rch1[u]] ? 0 : 1;
    rrev[u] = 0;
    return true;
  };

  const rrotate = (u) => {
    const f = rfa[u], g = rfa[f], d = rch1[f] === u ? 1 : 0;
    if (d === 1) { rch1[f] = rch0[u]; } else { rch0[f] = rch1[u]; }
    const child = d === 1 ? rch0[u] : rch1[u];
    if (child) rfa[child] = f;
    rfa[u] = g;
    if (g) { if (rch1[g] === f) rch1[g] = u; else rch0[g] = u; }
    if (d === 1) rch0[u] = f; else rch1[u] = f;
    rfa[f] = u;
    rpush_up(f); rpush_up(u);
    snap({
      note: 'rrotate(' + u + ')：' + (d === 1 ? '左' : '右') + '旋，父亲 ' + f + ' 下移；rsz[' + f + '] = ' + rsz[f] + '，rsz[' + u + '] = ' + rsz[u],
      lines: [15, 17, 18, 19, 20, 21, 22, 23], cur: u, t: f, phase: 'rotate', opIndex: curOp, path: [],
    });
  };

  const rsplay = (u, goal) => {
    const stack = [];
    let t = u;
    stack.push(t);
    while (rfa[t] !== goal) { t = rfa[t]; stack.push(t); }
    snap({ note: 'rsplay(' + u + ', ' + goal + ')：先把根到 u 的路径压栈，自上而下 push_down', lines: [26, 28, 29, 30, 31], cur: u, phase: 'splay', opIndex: curOp, path: stack.slice() });
    while (stack.length) {
      const x = stack.pop();
      if (rrev[x]) {
        rpush_down(x);
        snap({ note: 'rpush_down(' + x + ')：有 rev 标记，交换左右儿子并把标记传给两个儿子', lines: [6, 8, 9, 10, 11, 12], cur: x, phase: 'pushdown', opIndex: curOp, path: stack.slice() });
      }
    }
    while (rfa[u] !== goal) {
      const f = rfa[u], g = rfa[f];
      if (g !== goal) {
        const du = rch1[f] === u ? 1 : 0, dg = rch1[g] === f ? 1 : 0;
        snap({ note: du === dg ? '同向（zig-zig）：先旋父亲 ' + f : '异向（zig-zag）：先旋自己 ' + u, lines: [32, 37, 38], cur: u, t: f, phase: 'splay', opIndex: curOp, path: [] });
        rrotate(du === dg ? f : u);
      }
      rrotate(u);
    }
    if (!goal) rroot = u;
    snap({ note: 'rsplay 结束：' + (goal ? u + ' 转到 ' + goal + ' 的子节点位置' : 'rroot = ' + u), lines: [42], cur: u, phase: 'splay-root', opIndex: curOp, path: [] });
  };

  const rkth = (k) => {
    let u = rroot;
    while (u) {
      if (rrev[u]) {
        rpush_down(u);
        snap({ note: 'rkth(' + k + ')：节点 ' + u + ' 有 rev，先 push_down 再按位置走', lines: [50], cur: u, phase: 'pushdown', opIndex: curOp, path: [] });
      }
      const l = rch0[u];
      if (k <= rsz[l]) {
        snap({ note: '第 ' + k + ' 位在左边：rsz[' + l + '] = ' + rsz[l] + ' >= ' + k, lines: [52], cur: u, phase: 'kth', opIndex: curOp, path: [] });
        u = l;
      } else if (k === rsz[l] + 1) {
        snap({ note: '第 ' + k + ' 位就是节点 ' + u + '（rval = ' + rval[u] + '），rsplay 到根', lines: [53], cur: u, phase: 'kth', opIndex: curOp, path: [] });
        rsplay(u, 0);
        return u;
      } else {
        snap({ note: 'k -= rsz[left] + 1 → ' + (k - rsz[l] - 1) + '，往右走', lines: [54], cur: u, phase: 'kth', opIndex: curOp, path: [] });
        k -= rsz[l] + 1;
        u = rch1[u];
      }
    }
    return 0;
  };

  (function build(lo, hi, f) {
    if (lo > hi) return 0;
    const mid = (lo + hi) >> 1;
    const u = ++rtot;
    rval[u] = mid; rfa[u] = f; rrev[u] = 0;
    rch0[u] = build(lo, mid - 1, u);
    rch1[u] = build(mid + 1, hi, u);
    rpush_up(u);
    return u;
  })(0, len + 1, 0);
  rroot = 1;
  snap({ note: 'build_seq(' + len + ')：rbuild 递归建出 ' + rtot + ' 个节点，中序遍历正好是 0..' + (len + 1) + '（两端是哨兵），rroot = ' + rroot, lines: [71, 73, 74], phase: 'build', opIndex: -1 });

  for (let oi = 0; oi < ops.length; oi++) {
    const [l, r] = ops[oi];
    curOp = oi;
    snap({ note: '翻转 [' + l + ', ' + r + ']：先 rkth(' + l + ')、rkth(' + (r + 2) + ') 把 l-1 与 r+1 转到根和根的右儿子', lines: [77, 79, 80], phase: 'begin', opIndex: oi });
    const L = rkth(l);
    const R = rkth(r + 2);
    rsplay(L, 0);
    rsplay(R, L);
    const t = rch0[R];
    if (t) {
      rrev[t] = rrev[t] ? 0 : 1;
      snap({ note: 'R = ' + R + ' 是根的右儿子，它的左子树 t = ' + t + ' 正好是 [' + l + ', ' + r + '] → rrev[' + t + '] ^= 1', lines: [83, 84], cur: R, t, phase: 'toggle', opIndex: oi });
    }
  }
  const fin = logical();
  snap({ note: 'print_seq：一路 push_down 后中序遍历，序列 = [' + fin.join(', ') + ']', lines: [87, 90, 91, 92, 93], phase: 'final', opIndex: ops.length - 1 });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');

  const list = document.createElement('div');
  list.className = 'plist';
  data.ops.forEach((o, i) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (i === frame.opIndex ? ' on' : '');
    c.textContent = (i + 1) + ': 翻转 [' + o[0] + ', ' + o[1] + ']';
    list.appendChild(c);
  });
  box.appendChild(list);

  const strip = document.createElement('div');
  strip.className = 'strip';
  frame.seq.forEach((v) => {
    const c = document.createElement('div');
    c.className = 'b';
    c.style.border = '2px solid var(--ok)';
    c.style.color = 'var(--text)';
    c.textContent = String(v);
    strip.appendChild(c);
  });
  if (!frame.seq.length) {
    const e = document.createElement('div');
    e.className = 'sub-line';
    e.textContent = '（序列为空）';
    strip.appendChild(e);
  }
  box.appendChild(strip);

  const pos = {};
  let leaf = 0;
  const dx = 52, dy = 62;
  (function dfs(u, d) {
    if (!u) return;
    dfs(frame.ch0[u], d + 1);
    pos[u] = { x: leaf++ * dx, y: d * dy };
    dfs(frame.ch1[u], d + 1);
  })(frame.root, 0);
  const ids = Object.keys(pos).map(Number);
  if (ids.length) {
    const pts = ids.map((u) => pos[u]);
    let s = '<svg width="100%" height="' + (Math.max(...pts.map((p) => p.y)) + 84) + '" viewBox="' + svgBox(pts, 38) + '" role="img" aria-label="文艺平衡树">';
    for (const u of ids) {
      for (const [ch, tag] of [[frame.ch0[u], 'L'], [frame.ch1[u], 'R']]) {
        if (!ch || !pos[ch]) continue;
        s += edgeSvg(pos[u], pos[ch], { r: 21, dash: frame.rev[u] ? '4 3' : '' });
        s += textSvg((pos[u].x + pos[ch].x) / 2 + (tag === 'L' ? -9 : 9), (pos[u].y + pos[ch].y) / 2, tag, { size: 9, fill: 'var(--faint)' });
      }
    }
    const isSentinel = (u) => frame.val[u] < 1 || frame.val[u] > data.len;
    for (const u of ids) {
      let stroke = 'var(--border)', width = 1.5;
      if (isSentinel(u)) stroke = 'var(--faint)';
      if (frame.path.includes(u)) { stroke = 'var(--info)'; width = 2; }
      if (frame.t === u) { stroke = 'var(--warn)'; width = 2.5; }
      if (u === frame.cur) { stroke = 'var(--accent)'; width = 3; }
      if (u === frame.t && frame.phase === 'toggle') { stroke = 'var(--ok)'; width = 3; }
      const p = pos[u];
      const dash = frame.rev[u] ? ' stroke-dasharray="5 3"' : '';
      s += '<rect x="' + (p.x - 21) + '" y="' + (p.y - 19) + '" width="42" height="38" rx="8" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '"' + dash + '/>';
      s += textSvg(p.x, p.y - 1, String(frame.val[u]), { size: 13, weight: 700, fill: isSentinel(u) ? 'var(--faint)' : 'var(--text)' });
      s += textSvg(p.x, p.y + 12, 'sz' + frame.sz[u], { size: 9, fill: 'var(--faint)' });
      if (frame.rev[u]) s += textSvg(p.x + 15, p.y - 12, '⇄', { size: 11, weight: 700, fill: 'var(--warn)' });
    }
    s += '</svg>';
    const wrap = document.createElement('div');
    wrap.innerHTML = s;
    box.appendChild(wrap);
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'final') eq.textContent = '最终序列：[' + frame.seq.join(', ') + ']';
  else if (frame.phase === 'toggle') eq.textContent = 'rrev[' + frame.t + '] ^= 1：整段只打标记，真正交换留到下次访问';
  else eq.textContent = '方块里是 rval（位置），sz = rsz；⇄ 表示该子树有 rev 标记未下传';
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
