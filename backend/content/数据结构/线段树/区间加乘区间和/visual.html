<script type="text/plain" id="code-src">
void push_up(int p)
{
	ans[p] = (ans[ls(p)] + ans[rs(p)]) % m;
}

void build(int p, int l, int r)
{
	tagadd[p] = 0; tagmul[p] = 1;
	if(l == r) {ans[p] = a[l]; return;}
	int mid = (l + r) >> 1;
	build(ls(p), l, mid);
	build(rs(p), mid + 1, r);
	push_up(p);
}

void f(int p, int l, int r, ll kadd, ll kmul) 
{
	tagadd[p] = (tagadd[p] * kmul + kadd) % m;
	tagmul[p] = tagmul[p] * kmul % m;
	ans[p] = (ans[p] * kmul + (r - l + 1) * kadd) % m;
}

void push_down(int p, int l, int r)
{
	int mid = (l + r) >> 1;
	f(ls(p), l, mid, tagadd[p], tagmul[p]);
	f(rs(p), mid + 1, r, tagadd[p], tagmul[p]);
	tagadd[p] = 0; tagmul[p] = 1;
}

void update(int ul, int ur, int p, int l, int r, ll kadd, ll kmul)
{
	if(ul <= l && ur >= r) //lazy tag. Zzz...
	{
		f(p, l, r, kadd, kmul);
		return;
	}
	push_down(p, l, r); //��˯�ˣ����ѡ�
	int mid = (l + r) >> 1;
	if(mid >= ul) update(ul, ur, ls(p), l, mid, kadd, kmul);
	if(mid < ur) update(ul, ur, rs(p), mid + 1, r, kadd, kmul);
	push_up(p);
}

ll query(int ql, int qr, int p, int l, int r)
{
	ll res = 0;
	if(ql <= l && qr >= r) return ans[p] % m;
	push_down(p, l, r);
	int mid = (l + r) >> 1;
	if(mid >= ql) res += query(ql, qr, ls(p), l, mid);
	if(mid < qr) res += query(ql, qr, rs(p), mid + 1, r);
	return res % m;
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：线段树（区间加乘、区间和） === */
const META = {
  title: '线段树（区间加 / 区间乘 / 区间和）',
  complexity: '建树 O(n)　区间加乘 / 区间和 O(log n)',
  inputHint: '第一行 n q m；第二行 n 个数；随后 q 行：1 x y k 区间乘，2 x y k 区间加，3 x y 区间和',
  file: 'P3373 【模板】线段树 2.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前节点 p（粗实线）' },
    { color: 'var(--warn)', text: 'push_down 把标记下传到的子节点（粗虚线）' },
    { color: 'var(--ok)', text: '被 [ul, ur] 完全覆盖、直接打标记的节点' },
    { color: 'var(--info)', text: '查询 [ql, qr] 命中的节点' },
    { color: 'var(--border)', text: '其它节点' },
  ],
};
const MAX_N = 8;
const MAX_OPS = 4;
const DEFAULT_INPUT = '6 3 100\n1 2 3 4 5 6\n2 1 3 5\n1 2 4 2\n3 1 4';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入 n q m、数组和操作');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  if (lines.length < 2) throw new Error('需要两行：n q m 和数组');
  const h = lines[0].trim().split(/\s+/).map(Number);
  if (h.length !== 3 || h.some((x) => !Number.isInteger(x))) throw new Error('第一行需要三个整数 n q m');
  const [n, q, m] = h;
  if (n < 1 || n > MAX_N) throw new Error('n 需在 1 到 ' + MAX_N + ' 之间（演示规模）');
  if (q < 1 || q > MAX_OPS) throw new Error('操作数 q 需在 1 到 ' + MAX_OPS + ' 之间');
  if (m < 2 || m > 1000) throw new Error('模数 m 需在 2 到 1000 之间');
  if (lines.length !== q + 2) throw new Error('需要 1 行数组 + ' + q + ' 行操作');
  const arr = lines[1].trim().split(/\s+/).map(Number);
  if (arr.length !== n || arr.some((x) => !Number.isInteger(x))) throw new Error('第二行需要正好 ' + n + ' 个整数');
  const ops = [];
  for (let i = 0; i < q; i++) {
    const p = lines[i + 2].trim().split(/\s+/).map(Number);
    if (p.some((x) => !Number.isInteger(x))) throw new Error('操作行只能包含整数');
    if (p[0] === 3 && p.length === 3) {
      if (p[1] < 1 || p[2] > n || p[1] > p[2]) throw new Error('区间需满足 1 <= l <= r <= ' + n);
      ops.push({ op: 3, x: p[1], y: p[2] });
    } else if ((p[0] === 1 || p[0] === 2) && p.length === 4) {
      if (p[1] < 1 || p[2] > n || p[1] > p[2]) throw new Error('区间需满足 1 <= l <= r <= ' + n);
      ops.push({ op: p[0], x: p[1], y: p[2], k: p[3] });
    } else throw new Error('操作格式：1 x y k / 2 x y k / 3 x y');
  }
  return { a: [0, ...arr], n, q, mod: m, ops };
}

function randomInput() {
  const n = 5 + Math.floor(Math.random() * 4);
  const q = 2 + Math.floor(Math.random() * 3);
  const m = 50 + Math.floor(Math.random() * 50);
  const rows = [n + ' ' + q + ' ' + m, Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 9)).join(' ')];
  for (let i = 0; i < q; i++) {
    const l = 1 + Math.floor(Math.random() * n);
    const r = l + Math.floor(Math.random() * (n - l + 1));
    const op = 1 + Math.floor(Math.random() * 3);
    rows.push(op === 3 ? '3 ' + l + ' ' + r : op + ' ' + l + ' ' + r + ' ' + (1 + Math.floor(Math.random() * 4)));
  }
  return rows.join('\n');
}

function buildFrames({ a, n, q, mod, ops }) {
  const size = 4 * n + 5;
  const ans = new Array(size).fill(0), tagadd = new Array(size).fill(0), tagmul = new Array(size).fill(1);
  const frames = [];
  let curOp = -1;
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], ans: ans.slice(), tagadd: tagadd.slice(), tagmul: tagmul.slice(),
    cur: 0, l: 1, r: n, hl: [], full: 0, result: null, range: null, phase: 'init', opIndex: -1,
  }, f));

  snap({ note: '初始化：ans、tagadd、tagmul 全 0 / 1，准备 build(1, 1, ' + n + ')', lines: [6, 8] });
  const pushUp = (p) => { ans[p] = (ans[2 * p] + ans[2 * p + 1]) % mod; };
  const apply = (p, l, r, kadd, kmul) => {
    tagadd[p] = (tagadd[p] * kmul + kadd) % mod;
    tagmul[p] = (tagmul[p] * kmul) % mod;
    ans[p] = (ans[p] * kmul + (r - l + 1) * kadd) % mod;
  };

  (function build(p, l, r) {
    tagadd[p] = 0; tagmul[p] = 1;
    if (l === r) {
      ans[p] = a[l];
      snap({ note: 'build(p = ' + p + ', l = r = ' + l + ')：叶子 ans[' + p + '] = a[' + l + '] = ' + a[l] + '，tagadd = 0，tagmul = 1', lines: [6, 8, 9], cur: p, l, r, phase: 'build' });
      return;
    }
    const mid = (l + r) >> 1;
    snap({ note: 'build(p = ' + p + ', [' + l + ', ' + r + '])：mid = ' + mid + '，tagadd[' + p + '] = 0，tagmul[' + p + '] = 1', lines: [6, 8, 10], cur: p, l, r, phase: 'build' });
    build(2 * p, l, mid);
    build(2 * p + 1, mid + 1, r);
    pushUp(p);
    snap({ note: 'push_up(' + p + ')：ans[' + p + '] = ans[' + (2 * p) + '] + ans[' + (2 * p + 1) + '] = ' + ans[2 * p] + ' + ' + ans[2 * p + 1] + ' = ' + ans[p] + '（mod ' + mod + '）', lines: [1, 3, 13], cur: p, l, r, phase: 'push-up' });
  })(1, 1, n);

  const pushDownFrames = (p, l, r) => {
    const mid = (l + r) >> 1;
    apply(2 * p, l, mid, tagadd[p], tagmul[p]);
    apply(2 * p + 1, mid + 1, r, tagadd[p], tagmul[p]);
    const ka = tagadd[p], km = tagmul[p];
    tagadd[p] = 0; tagmul[p] = 1;
    snap({
      note: 'push_down(' + p + ')：把 add = ' + ka + '、mul = ' + km + ' 下传给儿子 ' + (2 * p) + '、' + (2 * p + 1) + '，然后清空自己的标记',
      lines: [23, 26, 27, 28], cur: p, l, r, hl: [2 * p, 2 * p + 1], phase: 'push-down',
    });
  };

  const update = (ul, ur, p, l, r, kadd, kmul) => {
    if (ul <= l && ur >= r) {
      apply(p, l, r, kadd, kmul);
      snap({
        note: '[' + l + ', ' + r + '] 被 [' + ul + ', ' + ur + '] 完全覆盖：f(' + p + ')，tagadd = ' + tagadd[p] + '，tagmul = ' + tagmul[p] + '，ans = ' + ans[p],
        lines: [31, 33, 35], cur: p, l, r, full: p, phase: 'apply', opIndex: curOp, range: [ul, ur],
      });
      return;
    }
    pushDownFrames(p, l, r);
    const mid = (l + r) >> 1;
    if (mid >= ul) update(ul, ur, 2 * p, l, mid, kadd, kmul);
    if (mid < ur) update(ul, ur, 2 * p + 1, mid + 1, r, kadd, kmul);
    pushUp(p);
    snap({ note: 'push_up(' + p + ')：ans[' + p + '] = ' + ans[2 * p] + ' + ' + ans[2 * p + 1] + ' = ' + ans[p], lines: [42], cur: p, l, r, phase: 'push-up', opIndex: curOp, range: [ul, ur] });
  };

  const query = (ql, qr, p, l, r) => {
    if (ql <= l && qr >= r) {
      snap({ note: '[' + l + ', ' + r + '] 完全包含在 [' + ql + ', ' + qr + '] 内：直接返回 ans[' + p + '] = ' + ans[p], lines: [48], cur: p, l, r, result: ans[p], phase: 'query-hit', opIndex: curOp, range: [ql, qr] });
      return ans[p];
    }
    pushDownFrames(p, l, r);
    const mid = (l + r) >> 1;
    let res = 0;
    if (mid >= ql) res += query(ql, qr, 2 * p, l, mid);
    if (mid < qr) res += query(ql, qr, 2 * p + 1, mid + 1, r);
    res %= mod;
    snap({ note: 'query([' + ql + ', ' + qr + '], p = ' + p + ') 汇总 res = ' + res, lines: [53], cur: p, l, r, result: res, phase: 'query-merge', opIndex: curOp, range: [ql, qr] });
    return res;
  };

  for (let oi = 0; oi < ops.length; oi++) {
    curOp = oi;
    const o = ops[oi];
    if (o.op === 3) {
      const v = query(o.x, o.y, 1, 1, n);
      snap({ note: '查询 [' + o.x + ', ' + o.y + '] 的答案 = ' + v, lines: [45, 53], cur: 1, l: 1, r: n, result: v, phase: 'answer', opIndex: oi, range: [o.x, o.y] });
    } else if (o.op === 1) {
      update(o.x, o.y, 1, 1, n, 0, o.k);
      snap({ note: '区间乘完成：[ ' + o.x + ', ' + o.y + ' ] ×= ' + o.k + '（kmul = ' + o.k + '，kadd = 0）', lines: [31, 44], cur: 1, l: 1, r: n, phase: 'op-done', opIndex: oi, range: [o.x, o.y] });
    } else {
      update(o.x, o.y, 1, 1, n, o.k, 1);
      snap({ note: '区间加完成：[ ' + o.x + ', ' + o.y + ' ] += ' + o.k + '（kadd = ' + o.k + '，kmul = 1）', lines: [31, 44], cur: 1, l: 1, r: n, phase: 'op-done', opIndex: oi, range: [o.x, o.y] });
    }
  }
  snap({ note: '结束：ans[1] = ' + ans[1] + '，tagadd[1] = ' + tagadd[1] + '，tagmul[1] = ' + tagmul[1], lines: [1], phase: 'done', opIndex: ops.length - 1, cur: 0 });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  const { n, mod } = data;
  stage.innerHTML = '';
  const box = document.createElement('div');

  const list = document.createElement('div');
  list.className = 'plist';
  data.ops.forEach((o, i) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (i === frame.opIndex ? ' on' : '');
    c.textContent = (i + 1) + ': ' + (o.op === 3 ? '和 ' + o.x + '-' + o.y : (o.op === 1 ? '乘 ' : '加 ') + o.x + '-' + o.y + ' ' + o.k);
    list.appendChild(c);
  });
  box.appendChild(list);

  const pos = {}, nodes = [];
  let leafIdx = 0;
  (function walk(p, l, r, d) {
    if (l === r) pos[p] = { x: leafIdx++ * 56, y: d * 68 };
    else {
      const mid = (l + r) >> 1;
      walk(2 * p, l, mid, d + 1);
      walk(2 * p + 1, mid + 1, r, d + 1);
      pos[p] = { x: (pos[2 * p].x + pos[2 * p + 1].x) / 2, y: d * 68 };
    }
    nodes.push({ p, l, r, x: pos[p].x, y: pos[p].y });
  })(1, 1, n, 0);

  if (nodes.length) {
    let s = '<svg width="100%" height="' + (Math.max(...nodes.map((p) => p.y)) + 96) + '" viewBox="' + svgBox(nodes, 46) + '" role="img" aria-label="线段树">';
    const byId = {};
    for (const nd of nodes) byId[nd.p] = nd;
    for (const nd of nodes) {
      for (const ch of [2 * nd.p, 2 * nd.p + 1]) {
        if (byId[ch]) s += edgeSvg(nd, byId[ch], { r: 24 });
      }
    }
    for (const nd of nodes) {
      let stroke = 'var(--border)', width = 1.5;
      if (frame.range && nd.l >= frame.range[0] && nd.r <= frame.range[1]) { stroke = 'var(--info)'; width = 2; }
      if (frame.hl.includes(nd.p)) { stroke = 'var(--warn)'; width = 2.5; }
      if (nd.p === frame.full) { stroke = 'var(--ok)'; width = 3; }
      if (nd.p === frame.cur) { stroke = 'var(--accent)'; width = 3; }
      s += '<rect x="' + (nd.x - 28) + '" y="' + (nd.y - 22) + '" width="56" height="44" rx="8" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '"/>';
      s += textSvg(nd.x, nd.y - 6, String(frame.ans[nd.p]), { size: 13, weight: 700 });
      s += textSvg(nd.x, nd.y + 5, '[' + nd.l + ',' + nd.r + ']', { size: 8, fill: 'var(--faint)' });
      s += textSvg(nd.x, nd.y + 16, '+' + frame.tagadd[nd.p] + ' ×' + frame.tagmul[nd.p], { size: 8, fill: 'var(--faint)' });
    }
    s += '</svg>';
    const wrap = document.createElement('div');
    wrap.innerHTML = s;
    box.appendChild(wrap);
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.phase === 'answer') eq.textContent = '查询答案 = ' + frame.result + '（mod ' + mod + ' 后）';
  else if (frame.result !== null) eq.textContent = '当前返回 ' + frame.result;
  else eq.textContent = '节点上方：ans[p]；下方：[l, r] 与 lazy（+tagadd ×tagmul），叶子区间长度 1';
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
