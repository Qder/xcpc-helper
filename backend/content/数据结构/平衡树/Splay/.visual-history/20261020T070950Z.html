<style>

<script type="text/plain" id="code-src">
void rorate(int x)
{
	int f = fa[x], gf = fa[f], chk = checkson(x); //checkson: 0 为左儿子，1 为右儿子
	//下注释以右旋为例（即 chk = 0)
	son[f][chk] = son[x][chk ^ 1]; //将 f 的左儿子设为 x 的右儿子
	if(son[x][chk ^ 1]) fa[son[x][chk ^ 1]] = f; //如果 x 右儿子存在，将其 fa 设为 f
	son[x][chk ^ 1] = f; //将 x 右儿子设为 f
	fa[f] = x; //将 f 的 fa 设为 x
	fa[x] = gf; //将 x 的 fa 设为 gf
	if(gf) son[gf][f == son[gf][1]] = x; //如果 gf 存在，将 gf 中 f 原来占的儿子位置设为 x
	push_up(f); push_up(x); //pushup 维护
}

void splay(int x)
{
	for(int f = fa[x]; (f = fa[x]) != 0; rorate(x)){
		if(fa[f]) rorate(checkson(x) == checkson(f) ? f : x);
	}
	root = x;
}

void ins(int k)
{ 
	if(!root){
		root = ++ tot;
		val[tot] = k, siz[tot] = cnt[tot] = 1;
		return;
	}
	int f = 0, cur = root;
	while(1){
		if(val[cur] == k){
			cnt[cur] ++;
			push_up(cur), push_up(f);
			splay(cur);
			break;
		}
		f = cur, cur = son[cur][val[cur] < k];
		if(!cur){
			val[++ tot] = k;
			siz[tot] = cnt[tot] = 1;
			fa[tot] = f, son[f][val[f] < k] = tot;
			push_up(f);
			splay(tot);
			break;
		}
	}
}

int query_rank(int k)
{
	int res = 0, cur = root;
	while(1){
		if(!cur) return res + 1;
		if(val[cur] > k){
			cur = son[cur][0];
		}
		else{
			res += siz[son[cur][0]];
			if(val[cur] == k){
				splay(cur);
				return res + 1;
			}
			res += cnt[cur];
			cur = son[cur][1];
		}
	}
}

int query_num(int k)
{
	int cur = root;
	while(1){
		if(siz[son[cur][0]] >= k){
			cur = son[cur][0];
		}
		else{
			k -= siz[son[cur][0]] + cnt[cur];
			if(k <= 0){
				splay(cur);
				return val[cur];
			}
			cur = son[cur][1];
		}
	}
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：普通平衡树（Splay） === */
const META = {
  title: '普通平衡树（Splay）',
  complexity: '均摊 O(log n)（每次访问把节点转到根）',
  inputHint: '第一行操作数 m；随后 m 行 op k（1 插入、3 查排名、4 查第 k 小）',
  file: '（splay）P3369 【模板】普通平衡树.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前访问 / 正在上旋的节点 x（粗实线）' },
    { color: 'var(--warn)', text: 'x 的父亲 f（本步被压下去）' },
    { color: 'var(--info)', text: '查找路径上经过的节点' },
    { color: 'var(--ok)', text: '已经 splay 到根 / 查询答案' },
    { color: 'var(--border)', text: '其它节点' },
  ],
};
const MAX_OPS = 10;
const MAX_N = 99;
const DEFAULT_INPUT = '7\n1 5\n1 3\n1 8\n1 6\n3 6\n4 2\n1 4';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入操作序列');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  const m = Number(lines[0].trim());
  if (!Number.isInteger(m) || m < 1 || m > MAX_OPS) throw new Error('操作数需在 1 到 ' + MAX_OPS + ' 之间（演示规模）');
  if (lines.length !== m + 1) throw new Error('第一行写操作数 m，后面必须正好有 m 行 op k');
  const ops = [];
  for (let i = 1; i <= m; i++) {
    const p = lines[i].trim().split(/\s+/).map(Number);
    if (p.length !== 2 || p.some((x) => !Number.isInteger(x))) throw new Error('第 ' + i + ' 个操作需要两个整数 op k');
    const [op, k] = p;
    if (op !== 1 && op !== 3 && op !== 4) throw new Error('本演示只支持 op = 1（插入）、3（查排名）、4（查第 k 小）');
    if (k < 1 || k > 99) throw new Error('k 需在 1 到 99 之间');
    ops.push({ op, k });
  }
  return { ops };
}

function randomInput() {
  const m = 5 + Math.floor(Math.random() * 4);
  const rows = [];
  let size = 0;
  for (let i = 0; i < m; i++) {
    const r = Math.random();
    if (size === 0 || r < 0.55) { rows.push('1 ' + (1 + Math.floor(Math.random() * 30))); size++; }
    else if (r < 0.8) rows.push('3 ' + (1 + Math.floor(Math.random() * 30)));
    else rows.push('4 ' + (1 + Math.floor(Math.random() * size)));
  }
  return m + '\n' + rows.join('\n');
}

function buildFrames({ ops }) {
  const son = [[0, 0]], fa = [0], val = [0], cnt = [0], siz = [0];
  let root = 0, tot = 0;
  const frames = [];
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], son: son.map((r) => r.slice()), fa: fa.slice(), val: val.slice(),
    cnt: cnt.slice(), siz: siz.slice(), root, cur: 0, f: 0, g: 0, path: [], ans: null, phase: 'init', opIndex: -1,
  }, f));

  const push_up = (x) => { siz[x] = siz[son[x][0]] + siz[son[x][1]] + cnt[x]; };
  const checkson = (x) => (son[fa[x]] && son[fa[x]][1] === x ? 1 : 0);
  let curOp = -1;

  const rotate = (x) => {
    const f = fa[x], gf = fa[f], chk = checkson(x);
    son[f][chk] = son[x][chk ^ 1];
    if (son[x][chk ^ 1]) fa[son[x][chk ^ 1]] = f;
    son[x][chk ^ 1] = f;
    fa[f] = x;
    fa[x] = gf;
    if (gf) son[gf][f === son[gf][1] ? 1 : 0] = x;
    push_up(f); push_up(x);
    snap({
      note: 'rorate(' + x + ')：' + (chk === 1 ? '左旋' : '右旋') + '，父亲 ' + f + ' 被压到 x 的' + (chk === 1 ? '左' : '右') + '边；' +
        'push_up(' + f + ') 后 siz[' + f + '] = ' + siz[f] + '，push_up(' + x + ') 后 siz[' + x + '] = ' + siz[x],
      lines: [1, 3, 5, 6, 7, 8, 9, 10, 11], cur: x, f, g: gf, phase: 'rotate', path: [], opIndex: curOp,
    });
  };

  const splay = (x) => {
    while (fa[x]) {
      const f = fa[x], g = fa[f];
      if (g) {
        const same = checkson(x) === checkson(f);
        snap({
          note: 'splay(' + x + ')：x 与父亲 ' + f + ' ' + (same ? '同向（zig-zig），先旋父亲 ' + f : '异向（zig-zag），先旋自己 ' + x) + '，再旋 ' + x,
          lines: [14, 16, 17], cur: x, f, g, phase: 'splay', path: [], opIndex: curOp,
        });
        rotate(same ? f : x);
      }
      rotate(x);
    }
    root = x;
    snap({ note: 'splay 结束：root = ' + x + '（被访问的节点转到根）', lines: [19], cur: x, phase: 'splay-root', path: [], opIndex: curOp });
  };

  for (let oi = 0; oi < ops.length; oi++) {
    const { op, k } = ops[oi];
    curOp = oi;
    if (op === 1) {
      if (!root) {
        root = ++tot; val[tot] = k; siz[tot] = cnt[tot] = 1;
        snap({ note: '树空：root = ++ tot = ' + tot + '，val = ' + k + '，cnt = siz = 1', lines: [22, 24, 25, 26], cur: root, opIndex: oi, phase: 'insert' });
        continue;
      }
      let f = 0, cur = root;
      const path = [];
      while (true) {
        path.push(cur);
        if (val[cur] === k) {
          cnt[cur]++;
          snap({ note: '找到相同值 ' + k + '（节点 ' + cur + '）：只把 cnt 加到 ' + cnt[cur], lines: [30, 31, 32], cur: root, opIndex: oi, phase: 'insert', path: path.slice() });
          push_up(cur); push_up(f);
          snap({ note: 'push_up(' + cur + ') → siz = ' + siz[cur] + '，push_up(' + f + ') → siz = ' + siz[f], lines: [33], cur: root, opIndex: oi, phase: 'insert', path: path.slice() });
          splay(cur);
          break;
        }
        f = cur;
        const dir = val[cur] < k ? 1 : 0;
        cur = son[cur][dir];
        snap({ note: 'val[' + f + '] = ' + val[f] + ' ' + (dir ? '<' : '>') + ' ' + k + '，走' + (dir ? '右' : '左') + '儿子' + (cur ? ' ' + cur : '（空）'), lines: [37], cur: cur || f, f, opIndex: oi, phase: 'search', path: path.slice() });
        if (!cur) {
          cur = ++tot; val[cur] = k; siz[cur] = cnt[cur] = 1;
          fa[cur] = f; son[f][val[f] < k ? 1 : 0] = cur;
          snap({ note: '新建节点 ' + cur + '（val = ' + k + '），挂到 ' + f + ' 的' + (val[f] < k ? '右' : '左') + '儿子', lines: [38, 39, 40, 41], cur, f, opIndex: oi, phase: 'insert', path: path.slice() });
          push_up(f);
          snap({ note: 'push_up(' + f + ') → siz[' + f + '] = ' + siz[f], lines: [42], cur, f, opIndex: oi, phase: 'insert', path: path.slice() });
          splay(cur);
          break;
        }
      }
    } else if (op === 3) {
      let res = 0, cur = root;
      const path = [];
      while (true) {
        path.push(cur);
        if (!cur) {
          snap({ note: '走到空节点：小于 ' + k + ' 的数共 res = ' + res + ' 个，排名 = ' + (res + 1), lines: [52, 53], ans: res + 1, opIndex: oi, phase: 'rank', path: path.slice() });
          break;
        }
        if (val[cur] > k) {
          snap({ note: 'val[' + cur + '] = ' + val[cur] + ' > ' + k + '，整棵右子树都更大，往左走', lines: [54, 55], cur, opIndex: oi, phase: 'rank', path: path.slice(), res });
          cur = son[cur][0];
        } else {
          res += siz[son[cur][0]];
          snap({ note: 'val[' + cur + '] = ' + val[cur] + ' <= ' + k + '，左子树 siz = ' + siz[son[cur][0]] + ' 全都更小，res = ' + res, lines: [57, 58], cur, opIndex: oi, phase: 'rank', path: path.slice(), res });
          if (val[cur] === k) {
            snap({ note: '命中 ' + k + '：res = ' + res + '，splay(' + cur + ') 后返回 res + 1 = ' + (res + 1), lines: [59, 60, 61], ans: res + 1, cur, opIndex: oi, phase: 'rank', path: path.slice(), res });
            splay(cur);
            break;
          }
          res += cnt[cur];
          snap({ note: 'val 不相等，加上 cnt[' + cur + '] = ' + cnt[cur] + '，res = ' + res, lines: [63], cur, opIndex: oi, phase: 'rank', path: path.slice(), res });
          cur = son[cur][1];
        }
      }
    } else {
      let kk = k, cur = root;
      const path = [];
      while (cur) {
        path.push(cur);
        if (siz[son[cur][0]] >= kk) {
          snap({ note: '左子树 siz = ' + siz[son[cur][0]] + ' >= k = ' + kk + '，第 ' + kk + ' 小在左边', lines: [72, 73, 74], cur, opIndex: oi, phase: 'kth', path: path.slice() });
          cur = son[cur][0];
        } else {
          kk -= siz[son[cur][0]] + cnt[cur];
          if (kk <= 0) {
            snap({ note: '减去左子树与 cnt 后 k = ' + kk + ' <= 0，命中节点 ' + cur + '，splay 后返回 val = ' + val[cur], lines: [77, 78, 79, 80], ans: val[cur], cur, opIndex: oi, phase: 'kth', path: path.slice() });
            splay(cur);
            break;
          }
          snap({ note: 'k 减去 siz[left] + cnt = ' + (siz[son[cur][0]] + cnt[cur]) + '，还剩 k = ' + kk + '，往右走', lines: [77, 82], cur, opIndex: oi, phase: 'kth', path: path.slice() });
          cur = son[cur][1];
        }
      }
      if (!cur) snap({ note: '第 ' + k + ' 小不存在（k 超过当前节点数）', lines: [71], ans: -1, opIndex: oi, phase: 'kth', path: path.slice() });
    }
  }
  snap({ note: '操作结束：' + (root ? 'root = ' + root + '，树里共 ' + siz[root] + ' 个数' : '树为空'), lines: [47], root, phase: 'done', opIndex: ops.length - 1 });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');

  const list = document.createElement('div');
  list.className = 'plist';
  data.ops.forEach((o, i) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (i === frame.opIndex ? ' on' : '');
    c.textContent = (i + 1) + ': ' + (o.op === 1 ? '插入 ' : o.op === 3 ? '排名 ' : '第k小 ') + o.k;
    list.appendChild(c);
  });
  box.appendChild(list);

  const pos = {};
  let leaf = 0;
  const dx = 54, dy = 62;
  (function dfs(u, d) {
    if (!u) return;
    dfs(frame.son[u][0], d + 1);
    pos[u] = { x: leaf++ * dx, y: d * dy };
    dfs(frame.son[u][1], d + 1);
  })(frame.root, 0);
  const ids = Object.keys(pos).map(Number);
  if (ids.length) {
    const pts = ids.map((u) => pos[u]);
    let s = '<svg width="100%" height="' + (Math.max(...pts.map((p) => p.y)) + 76) + '" viewBox="' + svgBox(pts, 36) + '" role="img" aria-label="Splay 平衡树">';
    for (const u of ids) {
      for (const [ch, tag] of [[frame.son[u][0], 'L'], [frame.son[u][1], 'R']]) {
        if (!ch || !pos[ch]) continue;
        s += edgeSvg(pos[u], pos[ch], { r: 21 });
        s += textSvg((pos[u].x + pos[ch].x) / 2 + (tag === 'L' ? -8 : 8), (pos[u].y + pos[ch].y) / 2, tag, { size: 9, fill: 'var(--faint)' });
      }
    }
    for (const u of ids) {
      let stroke = 'var(--border)', width = 1.5;
      if (frame.path.includes(u)) { stroke = 'var(--info)'; width = 2; }
      if (u === frame.f) { stroke = 'var(--warn)'; width = 2.5; }
      if (u === frame.cur) { stroke = 'var(--accent)'; width = 3; }
      if (u === frame.root) { stroke = 'var(--ok)'; width = 2.5; }
      if (frame.ans !== null && frame.phase === 'kth') { stroke = 'var(--ok)'; width = 3; }
      const p = pos[u];
      s += '<rect x="' + (p.x - 22) + '" y="' + (p.y - 19) + '" width="44" height="38" rx="8" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '"/>';
      s += textSvg(p.x, p.y - 1, String(frame.val[u]), { size: 14, weight: 700 });
      s += textSvg(p.x, p.y + 12, 's' + frame.siz[u] + '/c' + frame.cnt[u], { size: 9, fill: 'var(--faint)' });
    }
    s += '</svg>';
    const wrap = document.createElement('div');
    wrap.innerHTML = s;
    box.appendChild(wrap);
  } else {
    const e = document.createElement('div');
    e.className = 'sub-line';
    e.textContent = '（空树）';
    box.appendChild(e);
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.ans !== null) eq.textContent = '本次操作答案：' + frame.ans;
  else if (frame.phase === 'rotate') eq.textContent = 'rorate(' + frame.cur + ')：x = ' + frame.cur + '，f = ' + frame.f + (frame.g ? '，gf = ' + frame.g : '，gf = 0');
  else if (frame.phase === 'done') eq.textContent = 'siz[root] = ' + (frame.root ? frame.siz[frame.root] : 0) + '（sz 含重复值的个数）';
  else eq.textContent = '节点下方：s = siz（子树总个数，含重复），c = cnt（同值个数）';
  box.appendChild(eq);
  stage.appendChild(box);
}

/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
