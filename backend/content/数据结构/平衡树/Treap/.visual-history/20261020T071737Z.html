<script type="text/plain" id="code-src">
void push_up(int x)
{
	siz(x) = siz(ls(x)) + siz(rs(x)) + cnt(x);
}

void rrotate(int &p) //右旋
{
	int tmp = ls(p);
	ls(p) = rs(tmp), rs(tmp) = p;
	siz(tmp) = siz(p);
	push_up(p);
	p = tmp;
}

void lrotate(int &p) //左旋
{
	int tmp = rs(p);
	rs(p) = ls(tmp), ls(tmp) = p;
	siz(tmp) = siz(p);
	push_up(p);
	p = tmp;
}

void _add(int &p, int k)
{
	if(!p){
		p = ++ tot;
		siz(p) = cnt(p) = 1, val(p) = k;
		ord(p) = rand();
		return;
	}
	siz(p) ++;
	if(val(p) == k) cnt(p) ++;
	else if(val(p) > k){
		_add(ls(p), k);
		if(ord(p) > ord(ls(p))) rrotate(p);
	}
	else{
		_add(rs(p), k);
		if(ord(p) > ord(rs(p))) lrotate(p);
	}
}

void _del(int &p, int k)
{
	if(!p) return;
	if(val(p) == k){
		if(cnt(p) > 1){
			cnt(p) --, siz(p) --;
			return;
		}
		if(!ls(p) || !rs(p)){
			p = ls(p) + rs(p);
			return;
		}
		else if(ord(ls(p)) < ord(rs(p))){
			rrotate(p);
			_del(p, k);
		}
		else{
			lrotate(p);
			_del(p, k);
		}
	}
	else{
		if(val(p) < k){
			_del(rs(p), k);
			siz(p) --;
		}
		else{
			_del(ls(p), k);
			siz(p) --;
		}
	}
}

int query_rank(int p, int k) //查询 k 的排名
{
	if(!p) return 1;
	if(k < val(p)) return query_rank(ls(p), k);
	else if(k > val(p)) return siz(ls(p)) + cnt(p) + query_rank(rs(p), k);
	else return siz(ls(p)) + 1;
}

int query_num(int p, int k) //查询排名为 k 的数
{
	if(!p) return 0;
	if(k <= siz(ls(p))) return query_num(ls(p), k);
	else if(k > siz(ls(p)) + cnt(p)) return query_num(rs(p), k - siz(ls(p)) - cnt(p));
	else return val(p);
}
</script>

<script>

  //只调用,不要改写
  function layoutCircle(n, cx, cy, r) {
  return Array.from({ length: n }, (_, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

function layoutBinary(root, left, right, dx = 44, dy = 60) {
  const pos = {};
  let k = 0;
  (function dfs(u, d) {
    if (u == null) return;
    dfs(left[u], d + 1);
    pos[u] = { x: k++ * dx, y: d * dy };
    dfs(right[u], d + 1);
  })(root, 0);
  return pos;
}

function layoutTree(root, children, dx = 48, dy = 64) {
  const pos = {};
  let leaf = 0;
  (function dfs(u, d) {
    const cs = children[u] || [];
    if (cs.length === 0) { pos[u] = { x: leaf++ * dx, y: d * dy }; return; }
    cs.forEach((c) => dfs(c, d + 1));
    pos[u] = { x: (pos[cs[0]].x + pos[cs[cs.length - 1]].x) / 2, y: d * dy };
  })(root, 0);
  return pos;
}

function edgeSvg(a, b, o = {}) {
  const { r = 18, directed = false, color = 'var(--faint)', width = 2, dash = '' } = o;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const x1 = a.x + ux * r, y1 = a.y + uy * r, x2 = b.x - ux * r, y2 = b.y - uy * r;
  let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color +
    '" stroke-width="' + width + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  if (directed) {
    const hx = x2 - ux * 9, hy = y2 - uy * 9;
    s += '<polygon points="' + x2 + ',' + y2 + ' ' + (hx - uy * 5) + ',' + (hy + ux * 5) + ' ' +
      (hx + uy * 5) + ',' + (hy - ux * 5) + '" fill="' + color + '"/>';
  }
  return s;
}

function svgBox(points, pad = 30) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return x0 + ' ' + y0 + ' ' + (Math.max(...xs) + pad - x0) + ' ' + (Math.max(...ys) + pad - y0);
}

function textSvg(x, y, text, o = {}) {
  const { size = 12, weight = 400, fill = 'var(--text)', anchor = 'middle' } = o;
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + weight + '" text-anchor="' + anchor +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + text + '</text>';
}
/* === ALGO START：普通平衡树（Treap） === */
const META = {
  title: '普通平衡树（Treap）',
  complexity: '期望 O(log n)（按随机优先级 ord 旋转）',
  inputHint: '第一行操作数 m；随后 m 行 op k（1 插入、3 查排名、4 查第 k 小）',
  file: '（Treap）P3369 【模板】普通平衡树.cpp',
  lang: 'cpp',
  legend: [
    { color: 'var(--accent)', text: '当前递归到的节点 p（粗实线）' },
    { color: 'var(--warn)', text: '本步参与旋转的 tmp（粗虚线）' },
    { color: 'var(--info)', text: '查找路径上经过的节点' },
    { color: 'var(--ok)', text: '查询答案所在的节点' },
    { color: 'var(--border)', text: '其它节点' },
  ],
};
const MAX_OPS = 10;
const MAX_N = 99;
const DEFAULT_INPUT = '8\n1 5\n1 3\n1 8\n1 6\n1 4\n3 6\n4 2\n1 7';

function parseInput(text) {
  if (!text.trim()) throw new Error('请输入操作序列');
  const lines = text.trim().split(/\r?\n/).filter((s) => s.trim() !== '');
  const m = Number(lines[0].trim());
  if (!Number.isInteger(m) || m < 1 || m > MAX_OPS) throw new Error('操作数需在 1 到 ' + MAX_OPS + ' 之间（演示规模）');
  if (lines.length !== m + 1) throw new Error('第一行写操作数 m，后面必须正好有 m 行 op k');
  const ops = [];
  for (let i = 1; i <= m; i++) {
    const p = lines[i].trim().split(/\s+/).map(Number);
    if (p.length !== 2 || p.some((x) => !Number.isInteger(x))) throw new Error('第 ' + i + ' 个操作需要两个整数 op k');
    const [op, k] = p;
    if (op !== 1 && op !== 3 && op !== 4) throw new Error('本演示只支持 op = 1（插入）、3（查排名）、4（查第 k 小）');
    if (k < 1 || k > 99) throw new Error('k 需在 1 到 99 之间');
    ops.push({ op, k });
  }
  return { ops };
}

function randomInput() {
  const m = 6 + Math.floor(Math.random() * 4);
  const rows = [];
  let size = 0;
  for (let i = 0; i < m; i++) {
    const r = Math.random();
    if (size === 0 || r < 0.6) { rows.push('1 ' + (1 + Math.floor(Math.random() * 25))); size++; }
    else if (r < 0.82) rows.push('3 ' + (1 + Math.floor(Math.random() * 25)));
    else rows.push('4 ' + (1 + Math.floor(Math.random() * size)));
  }
  return m + '\n' + rows.join('\n');
}

function buildFrames({ ops }) {
  const ls = [0], rs = [0], siz = [0], cnt = [0], val = [0], ord = [0];
  let root = 0, tot = 0, seed = 20261020, curOp = -1;
  const frames = [];
  const snap = (f) => frames.push(Object.assign({
    note: '', lines: [1], ls: ls.slice(), rs: rs.slice(), siz: siz.slice(), cnt: cnt.slice(),
    val: val.slice(), ord: ord.slice(), root, cur: 0, tmp: 0, path: [], ans: null, phase: 'init', opIndex: -1,
  }, f));

  const rnd = () => {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed % 1000;
  };
  const push_up = (x) => { siz[x] = siz[ls[x]] + siz[rs[x]] + cnt[x]; };
  const link = (parent, dir, u) => {
    if (parent === 0) root = u;
    else if (dir === 0) ls[parent] = u;
    else rs[parent] = u;
  };
  const rrotate = (p, parent, dir) => {
    const tmp = ls[p];
    ls[p] = rs[tmp]; rs[tmp] = p;
    siz[tmp] = siz[p];
    push_up(p);
    link(parent, dir, tmp);
    snap({
      note: 'ord(' + p + ') = ' + ord[p] + ' > ord(' + tmp + ') = ' + ord[tmp] + '，对 ' + p + ' 右旋：tmp = ls(' + p + ') = ' + tmp +
        '，siz(' + tmp + ') = ' + siz[tmp] + '，siz(' + p + ') = ' + siz[p],
      lines: [6, 8, 9, 10, 11, 12], cur: tmp, tmp: p, phase: 'rotate', opIndex: curOp, path: [],
    });
    return tmp;
  };
  const lrotate = (p, parent, dir) => {
    const tmp = rs[p];
    rs[p] = ls[tmp]; ls[tmp] = p;
    siz[tmp] = siz[p];
    push_up(p);
    link(parent, dir, tmp);
    snap({
      note: 'ord(' + p + ') = ' + ord[p] + ' > ord(' + tmp + ') = ' + ord[tmp] + '，对 ' + p + ' 左旋：tmp = rs(' + p + ') = ' + tmp +
        '，siz(' + tmp + ') = ' + siz[tmp] + '，siz(' + p + ') = ' + siz[p],
      lines: [15, 17, 18, 19, 20, 21], cur: tmp, tmp: p, phase: 'rotate', opIndex: curOp, path: [],
    });
    return tmp;
  };

  const add = (p, k, parent, dir, path) => {
    if (!p) {
      p = ++tot;
      ls[p] = rs[p] = 0;
      siz[p] = cnt[p] = 1; val[p] = k; ord[p] = rnd();
      link(parent, dir, p);
      snap({ note: '空位置新建节点 ' + p + '：val = ' + k + '，cnt = siz = 1，ord = rand() = ' + ord[p], lines: [24, 26, 27, 28, 29, 30], cur: p, phase: 'add', opIndex: curOp, path: path.slice() });
      return p;
    }
    siz[p]++;
    if (val[p] === k) {
      cnt[p]++;
      snap({ note: 'val(' + p + ') = ' + k + ' 已存在：cnt 加到 ' + cnt[p] + '，siz = ' + siz[p], lines: [32, 33], cur: p, phase: 'add', opIndex: curOp, path: path.slice() });
    } else if (val[p] > k) {
      snap({ note: 'val(' + p + ') = ' + val[p] + ' > ' + k + '，递归 _add(ls(' + p + ') = ' + ls[p] + ', ' + k + ')', lines: [32, 34, 35], cur: p, phase: 'add', opIndex: curOp, path: path.concat([p]) });
      add(ls[p], k, p, 0, path.concat([p]));
      if (ord[p] > ord[ls[p]]) rrotate(p, parent, dir);
    } else {
      snap({ note: 'val(' + p + ') = ' + val[p] + ' < ' + k + '，递归 _add(rs(' + p + ') = ' + rs[p] + ', ' + k + ')', lines: [32, 38, 39], cur: p, phase: 'add', opIndex: curOp, path: path.concat([p]) });
      add(rs[p], k, p, 1, path.concat([p]));
      if (ord[p] > ord[rs[p]]) lrotate(p, parent, dir);
    }
    return p;
  };

  const rankOf = (p, k) => {
    if (!p) {
      snap({ note: '走到空节点：返回 1', lines: [77, 79], phase: 'rank', opIndex: curOp, path: [] });
      return 1;
    }
    if (k < val[p]) {
      snap({ note: 'k = ' + k + ' < val(' + p + ') = ' + val[p] + '：往左子树找', lines: [77, 80], cur: p, phase: 'rank', opIndex: curOp, path: [] });
      return rankOf(ls[p], k);
    }
    if (k > val[p]) {
      const inner = rankOf(rs[p], k);
      const r = siz[ls[p]] + cnt[p] + inner;
      snap({ note: 'k = ' + k + ' > val(' + p + ') = ' + val[p] + '：siz(ls) + cnt + 右子树结果 = ' + siz[ls[p]] + ' + ' + cnt[p] + ' + ' + inner + ' = ' + r, lines: [81], cur: p, phase: 'rank', opIndex: curOp, path: [] });
      return r;
    }
    snap({ note: '相等：siz(ls(' + p + ')) + 1 = ' + siz[ls[p]] + ' + 1 = ' + (siz[ls[p]] + 1), lines: [82], ans: siz[ls[p]] + 1, cur: p, phase: 'rank', opIndex: curOp, path: [] });
    return siz[ls[p]] + 1;
  };

  const numOf = (p, k) => {
    if (!p) {
      snap({ note: '第 ' + k + ' 小不存在（超过节点数）', lines: [85, 87], ans: -1, phase: 'kth', opIndex: curOp, path: [] });
      return 0;
    }
    if (k <= siz[ls[p]]) {
      snap({ note: 'k = ' + k + ' <= siz(ls(' + p + ')) = ' + siz[ls[p]] + '：第 ' + k + ' 小在左子树', lines: [85, 88], cur: p, phase: 'kth', opIndex: curOp, path: [] });
      return numOf(ls[p], k);
    }
    if (k > siz[ls[p]] + cnt[p]) {
      const nk = k - siz[ls[p]] - cnt[p];
      snap({ note: 'k = ' + k + ' > siz(ls) + cnt = ' + (siz[ls[p]] + cnt[p]) + '：换成右子树里第 ' + nk + ' 小', lines: [89], cur: p, phase: 'kth', opIndex: curOp, path: [] });
      return numOf(rs[p], nk);
    }
    snap({ note: 'siz(ls) < k <= siz(ls) + cnt：第 ' + k + ' 小就是 val(' + p + ') = ' + val[p], lines: [90], ans: val[p], cur: p, phase: 'kth', opIndex: curOp, path: [] });
    return val[p];
  };

  for (let oi = 0; oi < ops.length; oi++) {
    const { op, k } = ops[oi];
    curOp = oi;
    if (op === 1) add(root, k, 0, 0, []);
    else if (op === 3) rankOf(root, k);
    else numOf(root, k);
  }
  snap({ note: '操作结束：root = ' + root + '，树里共 ' + (root ? siz[root] : 0) + ' 个数', lines: [1, 2], root, phase: 'done', opIndex: ops.length - 1 });
  return frames;
}

/* 只根据 frame 与 data 绘制 */
function render(frame, stage, data) {
  stage.innerHTML = '';
  const box = document.createElement('div');

  const list = document.createElement('div');
  list.className = 'plist';
  data.ops.forEach((o, i) => {
    const c = document.createElement('span');
    c.className = 'pchip' + (i === frame.opIndex ? ' on' : '');
    c.textContent = (i + 1) + ': ' + (o.op === 1 ? '插入 ' : o.op === 3 ? '排名 ' : '第k小 ') + o.k;
    list.appendChild(c);
  });
  box.appendChild(list);

  const pos = {};
  let leaf = 0;
  const dx = 56, dy = 64;
  (function dfs(u, d) {
    if (!u) return;
    dfs(frame.ls[u], d + 1);
    pos[u] = { x: leaf++ * dx, y: d * dy };
    dfs(frame.rs[u], d + 1);
  })(frame.root, 0);
  const ids = Object.keys(pos).map(Number);
  if (ids.length) {
    const pts = ids.map((u) => pos[u]);
    let s = '<svg width="100%" height="' + (Math.max(...pts.map((p) => p.y)) + 82) + '" viewBox="' + svgBox(pts, 38) + '" role="img" aria-label="Treap">';
    for (const u of ids) {
      for (const [ch, tag] of [[frame.ls[u], 'L'], [frame.rs[u], 'R']]) {
        if (!ch || !pos[ch]) continue;
        s += edgeSvg(pos[u], pos[ch], { r: 22 });
        s += textSvg((pos[u].x + pos[ch].x) / 2 + (tag === 'L' ? -9 : 9), (pos[u].y + pos[ch].y) / 2, tag, { size: 9, fill: 'var(--faint)' });
      }
    }
    for (const u of ids) {
      let stroke = 'var(--border)', width = 1.5;
      if (frame.path.includes(u)) { stroke = 'var(--info)'; width = 2; }
      if (u === frame.tmp) { stroke = 'var(--warn)'; width = 2.5; }
      if (u === frame.cur) { stroke = 'var(--accent)'; width = 3; }
      if (frame.ans !== null && u === frame.cur) { stroke = 'var(--ok)'; width = 3; }
      const p = pos[u];
      s += '<rect x="' + (p.x - 23) + '" y="' + (p.y - 20) + '" width="46" height="40" rx="8" fill="var(--surface)" stroke="' + stroke + '" stroke-width="' + width + '"/>';
      s += textSvg(p.x, p.y - 2, String(frame.val[u]), { size: 14, weight: 700 });
      s += textSvg(p.x, p.y + 11, 's' + frame.siz[u] + ' c' + frame.cnt[u], { size: 9, fill: 'var(--faint)' });
      s += textSvg(p.x, p.y + 20, 'o' + frame.ord[u], { size: 8, fill: 'var(--faint)' });
    }
    s += '</svg>';
    const wrap = document.createElement('div');
    wrap.innerHTML = s;
    box.appendChild(wrap);
  } else {
    const e = document.createElement('div');
    e.className = 'sub-line';
    e.textContent = '（空树）';
    box.appendChild(e);
  }

  const eq = document.createElement('div');
  eq.className = 'eq-line';
  if (frame.ans !== null) eq.textContent = '本次操作答案：' + frame.ans;
  else if (frame.phase === 'rotate') eq.textContent = '旋转后 ' + frame.cur + ' 上移，' + frame.tmp + ' 被压下去（Treap 用随机 ord 当小根堆）';
  else if (frame.phase === 'done') eq.textContent = 'siz[root] = ' + (frame.root ? frame.siz[frame.root] : 0);
  else eq.textContent = '节点：值 / s siz / c cnt / o ord（ord = rand()，演示用固定种子）';
  box.appendChild(eq);
  stage.appendChild(box);
}
/* === ALGO END === */


/* ---------- 播放器（固定部分，不要修改） ---------- */
const MAX_FRAMES = 5000;
const $ = (id) => document.getElementById(id);
let data = null, frames = [], idx = 0, timer = null;

const codeSrcText = (($('code-src') || {}).textContent || '').replace(/^\r?\n/, '').replace(/\s+$/, '');
const codeLines = codeSrcText.split(/\r?\n/);
const hasCode = codeLines.length > 0 && codeLines.join('').trim() !== '';
const KW = /^(?:alignas|alignof|and|and_eq|asm|auto|bitand|bitor|bool|break|case|catch|char|class|compl|concept|const|consteval|constexpr|constinit|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|register|requires|return|short|signed|sizeof|static|static_assert|struct|switch|template|this|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|ll|ull|i64|u64|vector|string|map|set|queue|stack|pair|cin|cout|endl)$/;
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightCpp(line) {
  let i = 0, out = '', n = line.length;
  const push = (cls, text) => {
    const t = escapeHtml(text);
    out += cls ? '<span class="' + cls + '">' + t + '</span>' : t;
  };
  while (i < n) {
    if (line[i] === '/' && line[i + 1] === '/') { push('tok-cmt', line.slice(i)); break; }
    if (line[i] === '/' && line[i + 1] === '*') {
      const end = line.indexOf('*/', i + 2);
      const j = end < 0 ? n : end + 2;
      push('tok-cmt', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '"' || line[i] === "'") {
      const q = line[i];
      let j = i + 1;
      while (j < n) {
        if (line[j] === '\\') { j += 2; continue; }
        if (line[j] === q) { j++; break; }
        j++;
      }
      push('tok-str', line.slice(i, j));
      i = j; continue;
    }
    if (line[i] === '#' && !line.slice(0, i).trim()) { push('tok-pp', line.slice(i)); break; }
    if (/[A-Za-z_]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      push(KW.test(w) ? 'tok-kw' : '', w);
      i = j; continue;
    }
    if (/[0-9]/.test(line[i])) {
      let j = i + 1;
      while (j < n && /[0-9a-fA-FxXlLuU.]/.test(line[j])) j++;
      push('tok-num', line.slice(i, j));
      i = j; continue;
    }
    out += escapeHtml(line[i]);
    i++;
  }
  return out || ' ';
}
const lineEls = [];
if (hasCode) {
  const box = $('code');
  codeLines.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'ln';
    const num = document.createElement('b');
    num.textContent = String(i + 1);
    const span = document.createElement('span');
    span.innerHTML = highlightCpp(text === '' ? ' ' : text);
    row.appendChild(num); row.appendChild(span);
    box.appendChild(row); lineEls.push(row);
  });
  $('codeFile').textContent = (META && META.file) || 'code.cpp';
  $('codeLang').textContent = (META && META.lang) || 'cpp';
  $('codeLines').textContent = codeLines.length + ' 行';
} else {
  $('codeWrap').style.display = 'none';
  $('main').classList.remove('has-code');
}
let codeOpen = hasCode;
if (hasCode) {
  $('btnToggleCode').onclick = () => {
    codeOpen = !codeOpen;
    $('codeWrap').classList.toggle('collapsed', !codeOpen);
    $('main').classList.toggle('has-code', codeOpen);
    $('btnToggleCode').textContent = codeOpen ? '收起' : '展开';
  };
  let copiedTimer = 0;
  $('btnCopyCode').onclick = async () => {
    try {
      await navigator.clipboard.writeText(codeSrcText);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = codeSrcText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    $('btnCopyCode').textContent = '已复制';
    $('btnCopyCode').classList.add('copied');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => {
      $('btnCopyCode').textContent = '复制';
      $('btnCopyCode').classList.remove('copied');
    }, 1600);
  };
}
function highlight(lines) {
  if (!hasCode) return;
  lineEls.forEach((el) => el.classList.remove('hl'));
  const hit = (lines || []).filter((n) => n >= 1 && n <= lineEls.length);
  hit.forEach((n) => lineEls[n - 1].classList.add('hl'));
  if (!hit.length) return;
  const box = $('code'), first = lineEls[hit[0] - 1], last = lineEls[hit[hit.length - 1] - 1];
  if (first.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, first.offsetTop - 8);
  else if (last.offsetTop + last.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = last.offsetTop + last.offsetHeight - box.clientHeight + 8;
  }
}

function setError(msg) { $('error').textContent = msg || ''; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('btnPlay').textContent = '播放'; }
function show(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  $('note').textContent = f.note || '';
  render(f, $('stage'), data);
  highlight(f.lines);
  $('stepInfo').textContent = (idx + 1) + ' / ' + frames.length;
  $('progress').value = String(idx);
}
function play() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) show(0);
  stop();
  $('btnPlay').textContent = '暂停';
  const delay = 1100 - Number($('speed').value) * 100;
  timer = setInterval(() => {
    if (idx >= frames.length - 1) { stop(); return; }
    show(idx + 1);
  }, delay);
}
function load(text) {
  stop(); setError('');
  try {
    const parsed = parseInput(text);
    const built = buildFrames(parsed);
    if (!built.length) throw new Error('没有可演示的步骤');
    if (built.length > MAX_FRAMES) throw new Error('步骤过多（' + built.length + '），请缩小输入规模');
    data = parsed; frames = built;
    $('progress').max = String(frames.length - 1);
    show(0);
  } catch (e) {
    setError(e && e.message ? e.message : String(e));
  }
}

$('title').textContent = META.title;
document.title = META.title + ' · 算法可视化';
$('complexity').textContent = META.complexity;
$('hint').textContent = META.inputHint;
$('legend').innerHTML = META.legend.map((x) => '<span><i style="background:' + x.color + '"></i>' + x.text + '</span>').join('');
$('input').value = DEFAULT_INPUT;

$('btnPlay').onclick = () => (timer ? stop() : play());
$('btnNext').onclick = () => { stop(); show(idx + 1); };
$('btnPrev').onclick = () => { stop(); show(idx - 1); };
$('btnReset').onclick = () => { stop(); show(0); };
$('progress').oninput = (e) => { stop(); show(Number(e.target.value)); };
$('speed').oninput = () => { if (timer) play(); };
$('btnApply').onclick = () => load($('input').value);
$('btnRandom').onclick = () => { $('input').value = randomInput(); load($('input').value); };

document.addEventListener('keydown', (e) => {
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.code === 'ArrowRight') { stop(); show(idx + 1); }
  else if (e.code === 'ArrowLeft') { stop(); show(idx - 1); }
  else if (e.code === 'Home') { stop(); show(0); }
});

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'xcpc-theme') return;
  document.documentElement.dataset.theme = m.dark ? 'dark' : 'light';
  if (typeof m.hue === 'number') {
    document.documentElement.style.setProperty('--hue', String(m.hue));
    document.documentElement.style.setProperty('--accent', 'hsl(' + m.hue + ', 55%, ' + (m.dark ? 55 : 40) + '%)');
  }
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.dataset.theme = 'dark';
}

load(DEFAULT_INPUT);
</script>
